<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Ruan — núcleo pessoal simples, com alertas e aplicativos independentes.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <title>Ruan — Núcleo pessoal</title>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Ruan início"><span class="brand-mark">R</span><span><strong>ruan</strong><small>núcleo pessoal</small></span></a>
      <span class="privacy"><i></i> Área pessoal</span>
    </header>
    <section class="welcome">
      <p class="eyebrow">SEU ESPAÇO</p>
      <h1>Bom ter você aqui.</h1>
      <p class="muted">O essencial, sem complicar.</p>
    </section>
    <section class="section">
      <div class="section-title"><h2>Alertas</h2><span id="alert-count" class="count">0</span></div>
      <div id="alerts" class="alerts" aria-live="polite">
        <div class="empty"><span class="empty-mark">✓</span><div><strong>Tudo tranquilo por aqui</strong><p>Quando houver algo pedindo atenção, aparecerá aqui.</p></div></div>
      </div>
    </section>
    <section class="section">
      <div class="section-title"><h2>Seus aplicativos</h2></div>
      <a class="app-launch" href="../apps/organize/index.html">
        <span class="app-icon">O</span>
        <span class="app-copy"><strong>Organize</strong><small>Tarefas, projetos e setores pessoais</small></span>
        <span class="launch-arrow">↗</span>
      </a>
    </section>
    <footer><span>RUAN</span><span>Separado por padrão.</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
