<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Área ADM — Ruan</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}
body{margin:0;background:#08090c;color:#f4f4f5;min-height:100vh}main{width:min(1000px,100%);margin:auto;padding:34px 20px 48px}
header{text-align:center;margin:8vh 0 42px}.brand{font-weight:800;font-size:22px;color:#fff}h1{font-size:clamp(26px,5vw,42px);font-weight:500;margin:28px 0 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:820px;margin:auto}.tile{aspect-ratio:1/1;border:1px solid #292c34;background:#12141a;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(17px,2.5vw,22px);font-weight:500;transition:.15s}.tile:hover{background:#1a1c23;border-color:#555b68;transform:scale(1.02)}a{color:inherit;text-decoration:none}
.footer{text-align:center;margin-top:46px;color:#666b76;font-size:12px}
@media(max-width:650px){main{padding:24px 16px 40px}header{margin:5vh 0 30px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.tile{border-radius:15px}.footer{display:none}}
</style>
</head>
<body><main>
<header><div class="brand">◈ Área ADM</div><h1>Ruan</h1></header>
<section class="grid">
<a class="tile" href="#">Minha Gestão</a>
<a class="tile" href="#">Alertas</a>
<a class="tile" href="#">Relatórios</a>
<a class="tile" href="#">WordDark</a>
<a class="tile" href="#">Criar no Mundo</a>
<a class="tile" href="analytics/">Analytics</a>
</section>
<div class="footer">Área ADM · Ruan</div>
</main></body></html>
