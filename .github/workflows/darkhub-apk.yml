name: Build darkHub APK
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nome exibido no Android"
        required: true
        default: "darkHub"
        type: string
      app_id:
        description: "Identificador Android"
        required: true
        default: "com.worddark.darkhub"
        type: string
  push:
    branches: ["rewrite/darkhub-ecosystem-core"]
    paths:
      - "darkhub/**"
      - ".github/workflows/darkhub-apk.yml"
permissions:
  contents: read
concurrency:
  group: darkhub-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout darkHub source
        uses: actions/checkout@v4
      - name: Validate application identity
        env:
          APP_ID: ${{ github.event.inputs.app_id || 'com.worddark.darkhub' }}
        run: |
          set -euo pipefail
          test -s darkhub/index.html
          test -s darkhub/app.js
          test -s darkhub/core.js
          printf '%s' "$APP_ID" | grep -Eq '^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$' || { echo "Identificador Android inválido"; exit 1; }
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - name: Prepare standalone web app and Capacitor
        env:
          APP_NAME: ${{ github.event.inputs.app_name || 'darkHub' }}
          APP_ID: ${{ github.event.inputs.app_id || 'com.worddark.darkhub' }}
        run: |
          set -euo pipefail
          mkdir web
          cp -R darkhub/. web/
          npm init -y
          npm install --save-exact @capacitor/core @capacitor/android
          npm install --save-dev --save-exact @capacitor/cli
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = { appId: process.env.APP_ID, appName: process.env.APP_NAME, webDir: 'web', bundledWebRuntime: false, android: { allowMixedContent: false } };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2));
          NODE
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: darkhub-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
