name: Publish darkHub independent line
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}darkhub/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ecosystem site
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Checkout rewritten darkHub
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: darkhub-src
      - name: Assemble independent applications
        run: |
          set -euo pipefail
          mkdir -p site/darkhub site/hub site/worddark site/preview/darkhub
          cp -R darkhub-src/darkhub/. site/darkhub/
          cp -R repo/hub/. site/hub/
          cp -R repo/worddark/. site/worddark/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url=./darkhub/"><title>darkHub</title><script>location.replace('./darkhub/');</script></head><body><p>Abrindo o <a href="./darkhub/">darkHub</a>…</p></body></html>
          EOF
          cat > site/preview/darkhub/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url=../../darkhub/"><title>darkHub atualizado</title><script>location.replace('../../darkhub/');</script></head><body><p>Acesse a versão atual em <a href="../../darkhub/">darkHub</a>.</p></body></html>
          EOF
          cat > site/preview/darkhub/sw.js <<'EOF'
          self.addEventListener('install', event => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', event => event.waitUntil((async () => {
            await caches.keys().then(keys => Promise.all(keys.filter(key => key.startsWith('darkhub-')).map(key => caches.delete(key))));
            await self.registration.unregister();
            const target = new URL('../../darkhub/', self.registration.scope).href;
            const clients = await self.clients.matchAll({type:'window', includeUncontrolled:true});
            await Promise.all(clients.map(client => client.navigate(target)));
          })()));
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
