name: Deploy offline root with isolated darkHub preview
on:
  push:
    branches: ["main", "feature/ruan-hub-home-20261016"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/darkhub/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Checkout darkHub app from isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ruan-hub-home-20261016
          path: preview-src
      - name: Assemble offline root and darkHub preview
        run: |
          mkdir -p site
          cp -R repo/offline/. site/
          cp -R repo/hub site/hub
          cp -R repo/worddark site/worddark
          mkdir -p site/preview/darkhub
          cp -R preview-src/ruan/. site/preview/darkhub/
          sed -i 's|href="../hub/index.html"|href="../../hub/index.html"|' site/preview/darkhub/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload offline root and preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
