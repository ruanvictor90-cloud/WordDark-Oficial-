name: Publish darkHub on its own line
on:
  push:
    branches: ["main", "darkhub"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}darkhub/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
      - name: Checkout standalone darkHub line
        uses: actions/checkout@v4
        with:
          ref: darkhub
          path: darkhub-src
      - name: Publish only current apps
        run: |
          mkdir -p site/darkhub site/hub site/worddark
          cp -R darkhub-src/ruan/. site/darkhub/
          cp -R repo/hub/. site/hub/
          cp -R repo/worddark/. site/worddark/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="robots" content="noindex">
            <meta http-equiv="refresh" content="0; url=./darkhub/">
            <title>darkHub</title>
            <script>location.replace('./darkhub/');</script>
          </head>
          <body><p>Abrindo o <a href="./darkhub/">darkHub</a>…</p></body>
          </html>
          EOF
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload current site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
