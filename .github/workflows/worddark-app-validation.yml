name: WordDark Application Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "worddark/app/**"
      - "worddark/runtime/world/**"
      - "package.json"
      - ".github/workflows/worddark-app-validation.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "worddark/app/**"
      - "worddark/runtime/world/**"
      - "package.json"
      - ".github/workflows/worddark-app-validation.yml"

permissions:
  contents: read

concurrency:
  group: worddark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run complete WordDark regression suite
        run: npm test
