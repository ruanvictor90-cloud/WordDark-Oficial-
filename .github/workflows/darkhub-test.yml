name: darkHub engine checks
on:
  push:
    branches: ["darkhub"]
  pull_request:
    branches: ["darkhub"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check ruan/ruan-hub.js
      - run: node --check ruan/engine/darkhub-engine.js
      - run: node ruan/engine/darkhub-engine.test.js
      - run: node --check ruan/engine/information-inbox.js
      - run: node ruan/engine/information-inbox.test.js
      - run: node --check ruan/ruan-hub.js
      - name: Check hub keeps the apps drawer empty
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const html=readFileSync('ruan/index.html','utf8'); if(!html.includes('Nenhum aplicativo ainda') || !html.includes('development-workspace') || !html.includes('projects-import-file')) process.exit(1); console.log('darkHub structure checks passed.');"
