name: darkHub rewritten app checks
on:
  push:
    branches: ["rewrite/darkhub-ecosystem-core"]
    paths:
      - "darkhub/**"
      - ".github/workflows/darkhub-test.yml"
  pull_request:
    branches: ["darkhub", "main"]
    paths:
      - "darkhub/**"
      - ".github/workflows/darkhub-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          node --check darkhub/app.js
          node --check darkhub/core.js
          node --check darkhub/core.test.js
          node --check darkhub/app.test.js
      - name: Test encrypted vault and app factory
        run: node --test darkhub/core.test.js
      - name: Test structure and security boundaries
        run: node --test darkhub/app.test.js
      - name: Check no legacy personal app source remains in darkHub package
        run: |
          set -euo pipefail
          if grep -RniE 'Ruan|ruan-logo|personal-store|sovereign-core' darkhub; then
            echo "Legacy personal-app naming or imports detected in darkHub package."
            exit 1
          fi
