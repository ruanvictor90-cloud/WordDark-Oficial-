name: WordDark Oficial CI
on:
  push:
    branches: [main, world-appearance]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm run world:test
      - run: npm test
