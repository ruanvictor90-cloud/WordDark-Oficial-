name: Ruan App Checks
on:
  push:
    branches: [develop]
    paths:
      - "adm/ruan/**"
      - "package.json"
      - ".github/workflows/ruan-app-test.yml"
  pull_request:
    branches: [develop]
    paths:
      - "adm/ruan/**"
      - "package.json"
      - ".github/workflows/ruan-app-test.yml"
jobs:
  ruan-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm run ruan:test