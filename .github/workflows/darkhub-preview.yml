name: Preview darkHub on GitHub Pages
on:
  push:
    branches:
      - feature/ruan-hub-home-20261016
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/darkhub/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current published site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout darkHub feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ruan-hub-home-20261016
          path: preview-src
      - name: Add isolated darkHub preview without changing main source
        run: |
          mkdir -p site/preview/darkhub
          cp -R preview-src/ruan/. site/preview/darkhub/
          sed -i 's|href="../hub/index.html"|href="../../hub/index.html"|' site/preview/darkhub/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload combined site and preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
