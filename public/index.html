<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordDark — ADM</title><style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08090c;color:#f4f4f5;display:grid;place-items:center}main{width:min(430px,calc(100% - 32px));padding:34px 28px;border:1px solid #24262d;border-radius:24px;background:#101116}.mark{text-align:center;font-size:42px}.eyebrow{text-align:center;font-size:11px;letter-spacing:.2em;opacity:.5}h1{text-align:center;font-size:28px;margin:12px 0 7px}p{text-align:center;color:#a6a7ae;margin:0 0 28px}label{display:block;font-size:13px;margin-bottom:8px}input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid #30323a;background:#0a0b0f;color:#fff;outline:none;margin-bottom:16px}button{width:100%;padding:14px;border:0;border-radius:13px;background:#f2f2f2;color:#111;font-weight:800;cursor:pointer}.note{text-align:center;font-size:11px;color:#686d78;margin-top:16px}</style></head><body><main><div class="mark">◈</div><div class="eyebrow">WORDDARK · ÁREA PÚBLICA</div><h1>Acesso</h1><p>Entre para acessar a Área Pública.</p><form onsubmit="event.preventDefault();location.href='./'"><label>Conta ADM</label><input required autocomplete="username" placeholder="Sua conta"><label>Chave de acesso</label><input required type="password" autocomplete="current-password" placeholder="••••••••"><button>Entrar →</button></form><div class="note">Interface inicial</div></main></body></html>
