<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d">
<meta name="description" content="WordDark — entrada para WordDark, Céu e Terra.">
<title>WordDark</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--line:#292d37;--text:#f1f2f4;--accent:#d8ff70;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100svh;background:radial-gradient(ellipse at 50% -18%,#242b1b 0,transparent 44%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px}.world-entry{width:min(100%,540px);display:grid;gap:12px}.world-option{min-height:108px;display:flex;align-items:center;gap:18px;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(110deg,#14171b,#0f1115);color:var(--text);text-decoration:none;transition:border-color .2s,transform .2s,background .2s}.world-option:hover,.world-option:focus-visible{border-color:#6d7847;background:linear-gradient(110deg,#191f15,#11140f);transform:translateY(-2px);outline:none}.world-symbol{width:48px;height:48px;flex:0 0 48px;display:grid;place-items:center;border:1px solid #40483a;border-radius:15px;background:#171c13;color:var(--accent)}.world-symbol svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.world-option strong{font-size:clamp(18px,4.5vw,22px);font-weight:650;letter-spacing:-.025em}.world-option:first-child{border-color:#4c5835}.world-option:first-child .world-symbol{background:#202817;border-color:#697c43}.world-option:nth-child(2) .world-symbol{color:#c9d9ff;border-color:#39465f;background:#141a26}.world-option:nth-child(3) .world-symbol{color:#c8d5ad;border-color:#454b35;background:#191c14}@media(max-width:360px){body{padding:16px}.world-option{min-height:92px;padding:17px;gap:13px}.world-symbol{width:42px;height:42px;flex-basis:42px}}
</style>
</head>
<body>
<main class="world-entry" aria-label="Entradas do mundo">
<div class="world-option" aria-label="WordDark">
<span class="world-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 2.8 28 9.6v12.8L16 29.2 4 22.4V9.6Z"/><path d="M10 10.5v11l6-5.5 6 5.5v-11"/><circle cx="16" cy="16" r="2.2"/></svg></span>
<strong>WordDark</strong>
</div>
<a class="world-option" href="./ceu/" aria-label="Céu">
<span class="world-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M8 22.5h16a5 5 0 0 0 .4-10 8.5 8.5 0 0 0-16.3 2A5 5 0 0 0 8 22.5Z"/><path d="m12 26-1.5 3M20 26l-1.5 3"/></svg></span>
<strong>Céu</strong>
</a>
<a class="world-option" href="./terra/" aria-label="Terra">
<span class="world-symbol" aria-hidden="true"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12"/><path d="m5.5 12 6 1.5 2.5-3 5 1 1.5 4-3 2-1 5-4-1-1-4-4-2M19 4.8l1 4.2 4 1.5 3.2-1.3"/></svg></span>
<strong>Terra</strong>
</a>
</main>
</body>
</html>
