<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09070f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./app.css?v=20261016-ruan-hub">
<link rel="stylesheet" href="./home-hub.css?v=20261016-ruan-hub">
<title>Ruan — Hub pessoal</title>
</head>
<body class="ruan-launcher ruan-hub-home">
<main class="shell">
  <header class="topbar">
    <a class="brand brand-centered" href="./index.html" aria-label="Ruan — início">
      <img class="ruan-logo-image" src="./ruan-logo.svg" alt="Logo Ruan">
    </a>
    <div class="top-actions">
      <span class="online-dot" title="Online" aria-label="Online"></span>
      <div class="notification-wrap">
        <button id="notification-toggle" class="bell" type="button" aria-label="Alertas" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
          <span id="notification-badge" class="notification-badge" hidden>0</span>
        </button>
        <section id="notification-panel" class="notification-panel" hidden>
          <div class="notification-head"><strong>Alertas</strong><button id="notification-close" type="button" aria-label="Fechar">×</button></div>
          <div id="notification-list"></div>
        </section>
      </div>
    </div>
  </header>

  <section class="hub-welcome" aria-label="Boas-vindas">
    <span class="hub-orbit orbit-one"></span><span class="hub-orbit orbit-two"></span>
    <div class="hub-center-mark"><img src="./ruan-logo.svg" alt=""></div>
    <p class="hub-eyebrow">SEU ESPAÇO · SEU ECOSSISTEMA</p>
    <h1>O próximo passo<br><span>começa aqui.</span></h1>
    <p class="hub-subtitle">Seus aplicativos e o mundo WordDark, no mesmo lugar.</p>
    <div class="hub-status"><span></span> Hub pessoal pronto para operar</div>
  </section>

  <footer class="hub-footer"><span>RUAN</span><span>Central pessoal independente</span></footer>
</main>

<nav class="ruan-dock" aria-label="Navegação principal">
  <button id="apps-toggle" class="dock-button apps-button" type="button" aria-expanded="false" aria-controls="apps-drawer">
    <span class="dock-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></span>
    <span>Apps</span><span class="dock-chevron">⌃</span>
  </button>
  <a class="dock-button world-button" href="../hub/index.html" aria-label="Abrir WordDark Hub">
    <span class="world-logo"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5 55 18v28L32 59 9 46V18Z"/><path d="M20 21v22l12-12 12 12V21"/><circle cx="32" cy="31" r="4"/></svg></span>
    <span>WordDark Hub</span><span class="dock-arrow">↗</span>
  </a>
</nav>

<section id="apps-drawer" class="apps-drawer ruan-app-drawer" aria-label="Gaveta de aplicativos" hidden>
  <div class="drawer-head"><div><p class="hub-eyebrow">SEU ESPAÇO</p><strong>Aplicativos</strong></div><button id="apps-close" type="button" aria-label="Fechar gaveta">×</button></div>
  <div class="drawer-grid">
    <a class="drawer-app" href="./apps/pessoal/index.html"><span class="drawer-app-icon personal-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="27" cy="22" r="9"/><path d="M10 53c2-10 8-15 17-15s15 5 17 15"/><path d="m40 43 5 5 10-12"/></svg></span><span>Pessoal</span></a>
    <a class="drawer-app" href="./apps/shadow/index.html"><span class="drawer-app-icon shadow-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M5 32s10-17 27-17 27 17 27 17-10 17-27 17S5 32 5 32Z"/><circle cx="32" cy="32" r="11"/><circle cx="32" cy="32" r="5"/></svg></span><span>Shadow</span></a>
    <a class="drawer-app" href="./apps/entretenimento/index.html"><span class="drawer-app-icon media-icon"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="13" width="48" height="38" rx="8"/><path d="M22 13 14 25m24-12L26 25m24-12L38 25"/><path d="m28 27 13 8-13 8Z"/></svg></span><span>Entretenimento</span></a>
  </div>
</section>
<script src="./app.js?v=20261016-ruan-hub" defer></script>
<script src="./home-hub.js?v=20261016-ruan-hub" defer></script>
</body>
</html>
