<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#120d1c">
  <title>Em manutenção</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #120d1c; color: #f4efff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    main { width: min(100%, 520px); padding: 32px 24px; border: 1px solid #39284f; border-radius: 22px; background: #1b1427; text-align: center; }
    .mark { width: 56px; height: 56px; display: grid; place-items: center; margin: 0 auto 18px; border-radius: 16px; background: #302044; color: #d9b8ff; font-size: 28px; }
    h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 5vw, 2.1rem); }
    p { margin: 0; color: #c6bbd4; line-height: 1.65; }
    .status { display: inline-block; margin-top: 24px; padding: 8px 12px; border: 1px solid #4b3564; border-radius: 999px; color: #d9b8ff; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>Estamos em manutenção</h1>
    <p>As interfaces estão temporariamente indisponíveis enquanto preparamos a próxima etapa do projeto.</p>
    <span class="status">Retornaremos após a finalização</span>
  </main>
</body>
</html>
