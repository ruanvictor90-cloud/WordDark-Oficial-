name: WordDark — structural tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Operation lifecycle
        run: node world/core/operation.test.js
      - name: Communication
        run: node world/core/communication.test.js
      - name: Security
        run: node world/security/security.test.js
      - name: Road
        run: node world/core/road.test.js
      - name: Environment guard
        run: node world/core/environment-guard.test.js
      - name: Account manager
        run: node world/security/account-manager.test.js
      - name: Operation registry
        run: node world/core/operation-registry.test.js
      - name: Knowledge
        run: node world/library/knowledge.test.js
      - name: Persistence
        run: node world/core/persistence.test.js
      - name: ACK and error contracts
        run: node world/contracts/ack-error.test.js
      - name: Emergency Stop
        run: node world/core/emergency-stop.test.js
      - name: Dark Factory modular
        run: node world/sky/darkfactory/core/DF-0.7.test.js
      - name: Diagnostics and learning
        run: node world/core/diagnostics-learning.test.js
      - name: World Runtime
        run: node world/core/world-runtime.test.js
