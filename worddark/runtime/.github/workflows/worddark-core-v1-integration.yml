name: WordDark Core V1 Integration
on:
  push:
    branches: [staging]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node world/updates/worddark-core-v1/core/core-contracts.test.js
      - run: node world/updates/worddark-core-v1/core/integration.test.js
      - run: node world/updates/worddark-core-v1/core/full-integration.test.js
      - run: node world/core/single-core-fire.test.js
  single-core-fire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node world/core/single-core-fire.test.js
