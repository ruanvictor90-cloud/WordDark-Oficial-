<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Áudio · Dark Factory</title><link rel="stylesheet" href="../../../../ui/worddark-ui.css"></head><body class="wd-body"><main class="wd-main"><section class="wd-card full"><div class="wd-eyebrow">Setor 06</div><h1 class="wd-title">🔊 Áudio</h1><p class="wd-sub">Produção real de áudio WAV para testes locais.</p><button id="run" class="wd-btn primary">Produzir áudio real</button><audio id="preview" controls style="width:100%;margin-top:16px"></audio><p><a id="download" hidden>Baixar WAV</a></p><pre id="out" style="white-space:pre-wrap"></pre></section></main><script src="./renderer.js"></script><script src="./sector.js"></script><script>run.onclick=async()=>{const r=await WordDarkContentAudio.run({operationId:"AUDIO-TEST",topic:"WordDark",duration:5});out.textContent=JSON.stringify({...r,artifact:r.artifact?{type:r.artifact.type,mime:r.artifact.mime,duration:r.artifact.duration}:null},null,2);if(r.artifact&&r.artifact.blob){const u=URL.createObjectURL(r.artifact.blob);preview.src=u;download.href=u;download.download="worddark-audio.wav";download.hidden=false;}};</script></body></html>
