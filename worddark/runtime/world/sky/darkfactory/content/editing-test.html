<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocos de Edição — Dark Factory</title><link rel="stylesheet" href="../../../ui/worddark-ui.css"></head><body class="wd-body"><div class="wd-shell"><main class="wd-main"><div class="wd-card full"><div class="wd-eyebrow">Dark Factory · laboratório</div><h1 class="wd-title">Blocos de Edição</h1><p class="wd-sub">Cada bloco pode ser executado isoladamente ou combinado em uma operação. O setor também pode ser chamado diretamente, sem percorrer os demais setores.</p><div id="blocks"></div><hr><h2>Execução direta de setor</h2><button class="wd-btn primary" id="photo">📷 Editar foto</button> <button class="wd-btn primary" id="video">🎬 Editar vídeo</button><button class="wd-btn" id="full">⚙️ Fluxo completo</button><pre id="out" class="wd-card" style="white-space:pre-wrap"></pre></div></main></div><script src="../../../ui/worddark-ui.js"></script><script src="./editing-blocks.js"></script><script src="./editor-engine.js"></script><script src="./orchestrator.js"></script><script>
const catalog=WordDarkEditingBlocks.list(),engine=new WordDarkEditorEngine(),box=document.getElementById("blocks"),out=document.getElementById("out");
box.innerHTML=catalog.map(b=>'<button class="wd-btn" data-id="'+b.id+'" style="margin:5px">'+b.name+' · '+b.id+'</button>').join("");
box.addEventListener("click",e=>{const id=e.target.dataset.id;if(!id)return;const r=engine.apply({operationId:"TEST-EDIT-001",blockId:id,params:{mode:"TEST",source:"Central de Testes"}});out.textContent=JSON.stringify(r,null,2);});
document.getElementById("photo").onclick=()=>out.textContent=JSON.stringify(WordDarkContentFactoryOrchestrator.run({operationId:"DIRECT-PHOTO-001",sectors:["IMAGE"],asset:{id:"photo-demo"},brand:"WordDark"}),null,2);
document.getElementById("video").onclick=()=>out.textContent=JSON.stringify(WordDarkContentFactoryOrchestrator.run({operationId:"DIRECT-VIDEO-001",sectors:["VIDEO"],asset:{id:"video-demo"} }),null,2);
document.getElementById("full").onclick=()=>out.textContent=JSON.stringify(WordDarkContentFactoryOrchestrator.run({operationId:"FULL-001",brief:"conteúdo de teste"}),null,2);
</script></body></html>
