<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blocos de Edição — Dark Factory</title><link rel="stylesheet" href="../../../ui/worddark-ui.css"></head><body class="wd-body"><div class="wd-shell"><main class="wd-main"><div class="wd-card full"><div class="wd-eyebrow">Dark Factory · laboratório</div><h1 class="wd-title">Blocos de Edição</h1><p class="wd-sub">Cada bloco pode ser executado isoladamente ou combinado em uma operação. O resultado é uma instrução normalizada para o motor de produção.</p><div id="blocks"></div><pre id="out" class="wd-card" style="white-space:pre-wrap"></pre></div></main></div><script src="../../../ui/worddark-ui.js"></script><script src="./editing-blocks.js"></script><script src="./editor-engine.js"></script><script>
const catalog=WordDarkEditingBlocks.list(),engine=new WordDarkEditorEngine(),box=document.getElementById("blocks"),out=document.getElementById("out");
box.innerHTML=catalog.map(b=>'<button class="wd-btn" data-id="'+b.id+'" style="margin:5px">'+b.name+' · '+b.id+'</button>').join("");
box.addEventListener("click",e=>{const id=e.target.dataset.id;if(!id)return;const r=engine.apply({operationId:"TEST-EDIT-001",blockId:id,params:{mode:"TEST",source:"Central de Testes"}});out.textContent=JSON.stringify(r,null,2);});
</script></body></html>
