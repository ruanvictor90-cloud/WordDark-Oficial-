<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vídeo · Dark Factory</title><link rel="stylesheet" href="../../../../ui/worddark-ui.css"><style>video{max-width:100%;border-radius:14px;margin-top:14px}</style></head><body class="wd-body"><main class="wd-main"><section class="wd-card full"><div class="wd-eyebrow">Setor 05 · operacional</div><h1 class="wd-title">🎬 Vídeo</h1><p class="wd-sub">Produção real de vídeo no navegador, com reentrada independente.</p><input id="title" value="WORDDARK" style="width:100%;box-sizing:border-box;margin:8px 0;padding:12px"><input id="subtitle" value="O mundo por trás das operações." style="width:100%;box-sizing:border-box;margin:8px 0;padding:12px"><button id="run" class="wd-btn primary">Produzir vídeo real</button><div id="status" class="wd-badge">AGUARDANDO</div><video id="preview" controls hidden></video><a id="download" class="wd-btn" hidden>Baixar vídeo</a><pre id="out" style="white-space:pre-wrap"></pre></section></main><script src="../../../../ui/worddark-ui.js"></script><script src="./renderer.js"></script><script src="./sector.js"></script><script>document.getElementById("run").onclick=async()=>{const r=await WordDarkContentVideo.run({operationId:"VIDEO-UI-"+Date.now().toString(36).toUpperCase(),asset:{id:"browser-input"},format:"VIDEO",duration:5,title:document.getElementById("title").value,subtitle:document.getElementById("subtitle").value});document.getElementById("status").textContent=r.status;document.getElementById("out").textContent=JSON.stringify({...r,artifact:r.artifact?{...r.artifact,blob:"[BLOB]"}:null},null,2);if(r.artifact?.blob){const u=URL.createObjectURL(r.artifact.blob),v=document.getElementById("preview"),a=document.getElementById("download");v.src=u;v.hidden=false;a.href=u;a.download="worddark-video-"+Date.now()+".webm";a.hidden=false;}};</script></body></html>
