</style></head><body class="wd-body">
<main class="wd-main" style="margin-left:0"><div class="wd-surface wd-public">

<section class="wd-card"><textarea class="wd-textarea wd-request" id="humanRequest" placeholder="Ex.: Faz um conteúdo pra postar no Insta"></textarea>
<div class="wd-examples"><button class="wd-example" data-example="Gera um conteúdo pros canais">🎬 Gera um conteúdo pros canais</button><button class="wd-example" data-example="Faz um conteúdo pra postar no Insta">📱 Faz um conteúdo pra postar no Insta</button><button class="wd-example" data-example="Edita uma foto">🖼️ Edita uma foto</button><button class="wd-example" data-example="Corta esse vídeo">✂️ Corta esse vídeo</button><button class="wd-example" data-example="Troca o áudio">🔊 Troca o áudio</button><button class="wd-example" data-example="Coloca legenda">💬 Coloca legenda</button></div>
<button class="wd-btn primary wd-send" id="humanSubmit" type="button">Enviar pedido →</button><div class="wd-answer" id="humanAnswer"></div>
</section>
<div class="wd-note wd-muted">Você não precisa conhecer a estrutura interna do WordDark para usar a operação.</div>

<script>
(()=>{const request=document.getElementById("humanRequest"),answer=document.getElementById("humanAnswer");document.querySelectorAll("[data-example]").forEach(b=>b.onclick=()=>{request.value=b.dataset.example;request.focus()});document.getElementById("humanSubmit").onclick=()=>{const text=request.value.trim();if(!text){answer.style.display="block";answer.innerHTML="<strong>Escreva o que você precisa.</strong><span>Você pode falar normalmente.</span>";return}const hit=window.WordDarkUniversalLanguage?.resolveHuman(text);answer.style.display="block";answer.innerHTML="<strong>✓ "+(hit?.label||"Pedido recebido")+"</strong><span>Seu pedido foi entendido e está pronto para seguir pelo WordDark.</span>"}})();
</script></body></html>
