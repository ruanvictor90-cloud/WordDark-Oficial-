<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0d"><meta name="description" content="WordDark — mundo operacional modular.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./app-icon.svg" type="image/svg+xml">
<title>WordDark · Mundo Operacional</title>
<style>
:root{color-scheme:dark;--bg:#090a0d;--surface:#111318;--surface2:#171a20;--line:#292e37;--text:#f0f1f4;--muted:#9399a5;--gold:#c5a36c;--green:#87b398;--red:#d69a9a;--blue:#9eb8df;--radius:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;border-right:1px solid var(--line);background:#0c0d11}.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 24px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;border:1px solid #514735;background:#1b1915;color:var(--gold);font-weight:900;font-size:21px}.brand strong{letter-spacing:.12em;font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.nav-label{font-size:9px;letter-spacing:.2em;color:#6f7581;text-transform:uppercase;padding:12px 10px 6px}.nav{display:grid;gap:4px}.nav button{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid transparent;border-radius:12px;padding:11px 10px;background:transparent;color:#b6bbc5;font-size:12px}.nav button .ico{width:22px;text-align:center;font-size:16px;color:#858b98}.nav button.active{background:#201e19;border-color:#443a29;color:#f1dfbf}.nav button.active .ico{color:var(--gold)}.nav button:hover{background:#17191e}.side-bottom{margin-top:22px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#111318}.side-bottom strong{font-size:11px}.side-bottom p{font-size:10px;color:var(--muted);margin:5px 0 0}.main{min-width:0}.topbar{height:67px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 26px;background:#0c0d11}.crumb{font-size:11px;color:var(--muted)}.crumb b{color:var(--text);font-weight:600}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#1a1d23;border-radius:11px;padding:9px 12px;font-size:11px}.btn.gold{background:var(--gold);border-color:var(--gold);color:#17130b;font-weight:750}.btn:disabled{opacity:.4;cursor:not-allowed}.content{max-width:1250px;margin:auto;padding:27px 26px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:22px}.eyebrow{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}h1{font-size:clamp(24px,3.3vw,34px);letter-spacing:-.045em;line-height:1.1;margin:7px 0}.sub{margin:7px 0 0;color:var(--muted);font-size:12px;max-width:690px}.grid{display:grid;gap:13px}.grid.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);border-radius:var(--radius);padding:17px;background:linear-gradient(145deg,#14161b,#101115)}.card h3{font-size:12px;margin:0 0 12px;letter-spacing:.05em}.stat-label{color:var(--muted);font-size:10px}.stat-value{font-size:26px;letter-spacing:-.04em;margin:8px 0 2px}.stat-note{font-size:10px;color:var(--muted)}.gold-text{color:var(--gold)}.green-text{color:var(--green)}.red-text{color:var(--red)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0 12px}.section-head h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0}.section-head span{font-size:10px;color:var(--muted)}.module{display:flex;flex-direction:column;gap:10px;min-height:166px;text-align:left}.module-icon{width:43px;height:43px;border:1px solid #3b3e47;background:#202229;border-radius:14px;display:grid;place-items:center;font-size:20px;color:var(--gold)}.module h3{margin:0;font-size:13px}.module p{margin:0;color:var(--muted);font-size:11px}.module .status{margin-top:auto;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:var(--green)}.module .status.pending{color:var(--gold)}.module:hover{border-color:#5a4c35}.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #262a32;font-size:11px}.rowline:first-of-type{border-top:0}.rowline span{color:var(--muted)}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid #343943;border-radius:99px;padding:4px 8px;font-size:9px;color:#c2c6cf;white-space:nowrap}.pill.ready{color:var(--green);border-color:#31493a}.pill.pending{color:var(--gold);border-color:#4d4029}.pill.off{color:#a6abb5}.notice{padding:13px 14px;border-radius:13px;border:1px solid #4a402d;background:#1b1813;color:#c5b99f;font-size:11px;line-height:1.55}.notice strong{color:#f0ddb7}.notice.danger{border-color:#493035;background:#1b1215;color:#d5aeb1}.list{display:grid;gap:9px}.item{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);border-radius:14px;background:#14161b;padding:13px}.item-main{flex:1;min-width:0}.item-title{font-size:12px;font-weight:650;overflow-wrap:anywhere}.item-meta{font-size:10px;color:var(--muted);margin-top:4px;white-space:pre-wrap}.empty{border:1px dashed #343943;border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:11px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:10px;color:#b7bdc7}.field input,.field textarea,.field select{width:100%;background:#0b0c10;color:var(--text);border:1px solid #30343d;border-radius:10px;padding:11px}.field textarea{min-height:85px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-card{border:1px solid var(--line);border-radius:17px;background:#121419;padding:16px;margin-bottom:15px}.form-card h3{font-size:12px;margin:0 0 14px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th,.table td{text-align:left;padding:10px 8px;border-bottom:1px solid #292d35}.table th{color:var(--muted);font-weight:500}.table td:last-child,.table th:last-child{text-align:right}.big-number{font-size:32px;letter-spacing:-.04em}.transfer{border:1px solid #4b402c;border-radius:15px;padding:14px;background:#1a1712}.transfer h3{margin:0 0 6px;font-size:12px}.transfer p{font-size:11px;color:#c0b69f;margin:0 0 12px}.mobile-nav{display:none}.footer{color:#666c77;text-align:center;font-size:9px;margin-top:30px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#e8dfce;color:#19150f;border-radius:12px;padding:11px 15px;font-size:11px;z-index:10;transition:.2s;max-width:90vw}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:none}.topbar{padding:0 17px;height:58px}.content{padding:22px 16px 100px}.grid.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#0b0c10f5;border-top:1px solid var(--line);overflow-x:auto;gap:4px;backdrop-filter:blur(12px)}.mobile-nav button{flex:1;min-width:61px;display:grid;justify-items:center;gap:3px;border:1px solid transparent;border-radius:10px;background:transparent;padding:7px 4px;color:#9ca2ae;font-size:9px}.mobile-nav button span:first-child{font-size:17px}.mobile-nav button.active{background:#211e18;color:#f0dcb7;border-color:#433a2b}.page-head{flex-direction:column}.page-head .btn{align-self:flex-start}}
@media(max-width:430px){.grid.two,.grid.three{grid-template-columns:1fr}.stat-value{font-size:23px}.form-grid{grid-template-columns:1fr}.top-actions .optional{display:none}.card{padding:15px}.item{display:grid;grid-template-columns:36px minmax(0,1fr);align-items:start;gap:10px}.item>.module-icon{grid-column:1;grid-row:1 / span 2}.item-main{grid-column:2;min-width:0;overflow-wrap:anywhere}.item>.pill{grid-column:2;justify-self:start;max-width:100%}.item>div[style*="display:flex"]{grid-column:1 / -1;justify-content:flex-start;flex-wrap:wrap;min-width:0}.item .btn{white-space:normal;overflow-wrap:anywhere}}
</style></head>
<body>
<div class="layout">
<aside class="side">
<div class="brand"><div class="mark">◈</div><div><strong>WORDDARK</strong><small>Mundo operacional</small></div></div>
<div class="nav-label">Centro de comando</div><nav class="nav" id="sideNav">
<button data-page="overview" class="active"><span class="ico">⌂</span>Visão geral</button>
<button data-page="management"><span class="ico">▦</span>Gerenciamento</button>
<button data-page="sky"><span class="ico">☁</span>Céu · Soluções</button>
<button data-page="earth"><span class="ico">◉</span>Terra · Empresas</button>
<button data-page="finance"><span class="ico">▣</span>Financeira</button>
<button data-page="library"><span class="ico">▤</span>Biblioteca</button>
<button data-page="security"><span class="ico">⛨</span>Segurança</button>
</nav>
<div class="nav-label">Aplicativos empresariais</div><nav class="nav">
<button data-page="channels"><span class="ico">▶</span>Gestão de canais</button>
<button data-page="commerce"><span class="ico">◇</span>Empresa comercial</button>
</nav>
<div class="side-bottom"><strong>ESTADO DO MUNDO</strong><p>Alfa operacional local. Sem conectores externos ativos, sem publicação automática e sem movimentação financeira real.</p></div>
</aside>
<div class="main">
<header class="topbar"><div class="crumb"><span>WORDDARK</span> / <b id="crumbName">Visão geral</b></div><div class="top-actions"><button class="btn optional" id="newRequestTop">+ Nova intenção</button><button class="btn" id="backRuan">↖ Ruan</button></div></header>
<main class="content" id="screen"></main>
</div>
</div>
<nav class="mobile-nav" id="mobileNav">
<button data-page="overview" class="active"><span>⌂</span>Início</button><button data-page="management"><span>▦</span>Gestão</button><button data-page="sky"><span>☁</span>Céu</button><button data-page="earth"><span>◉</span>Terra</button><button data-page="finance"><span>▣</span>Finanças</button><button data-page="library"><span>▤</span>Biblioteca</button>
</nav><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const KEYS={requests:'worddark.ecosystem.requests.v1',ledger:'worddark.ecosystem.ledger.v1',transfers:'worddark.ecosystem.transfers.v1',notes:'worddark.ecosystem.notes.v1',tasks:'worddark.ecosystem.tasks.v1',contentJobs:'worddark.v1.content-jobs.v1',catalog:'worddark.commerce.catalog.v1',suppliers:'worddark.commerce.suppliers.v1',orders:'worddark.commerce.orders.v1',customers:'worddark.commerce.customers.v1'};
const read=k=>{try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch{return []}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Não foi possível salvar neste navegador.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'Sem data';
let requests=read(KEYS.requests),ledger=read(KEYS.ledger),transfers=read(KEYS.transfers),notes=read(KEYS.notes),tasks=read(KEYS.tasks),contentJobs=read(KEYS.contentJobs),catalog=read(KEYS.catalog),suppliers=read(KEYS.suppliers),orders=read(KEYS.orders),customers=read(KEYS.customers),page='overview';
const names={overview:'Visão geral',management:'Gerenciamento',sky:'Céu',earth:'Terra',finance:'Financeira',library:'Biblioteca',security:'Segurança',channels:'Gestão de canais',workbench:'Bancada de conteúdo',marketing:'Marketing',commerce:'Empresa comercial',catalog:'Catálogo de produtos',suppliers:'Fornecedores',orders:'Pedidos',customers:'Clientes',costs:'Custos e margem',commercialRules:'Regras comerciais'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function persist(){write(KEYS.requests,requests);write(KEYS.ledger,ledger);write(KEYS.transfers,transfers);write(KEYS.notes,notes);write(KEYS.tasks,tasks);write(KEYS.contentJobs,contentJobs)}
function navigate(p){page=p in names?p:'overview';$('crumbName').textContent=names[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('backRuan').addEventListener('click',()=>location.href='../../ruan/index.html');
$('newRequestTop').addEventListener('click',()=>navigate('management'));
function head(kicker,title,sub,button=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+button+'</div>'}
function stat(label,value,note,klass=''){return '<div class="card"><div class="stat-label">'+label+'</div><div class="stat-value '+klass+'">'+value+'</div><div class="stat-note">'+note+'</div></div>'}
function module(p,icon,title,desc,status='Disponível',cls='ready'){return '<button class="card module" data-go="'+p+'"><span class="module-icon">'+icon+'</span><h3>'+title+'</h3><p>'+desc+'</p><span class="status '+(cls==='pending'?'pending':'')+'">'+status+' →</span></button>'}
function empty(t){return '<div class="empty">'+t+'</div>'}
function reqList(limit=99){const arr=requests.slice().reverse().slice(0,limit);if(!arr.length)return empty('Nenhuma intenção registrada. Crie uma solicitação para iniciar um fluxo.');return '<div class="list">'+arr.map(r=>{const terminal=['Concluída','Cancelada'].includes(r.status);return '<div class="item"><div class="module-icon">↳</div><div class="item-main"><div class="item-title">'+esc(r.title)+'</div><div class="item-meta">'+esc(r.kind)+' · '+esc(r.area)+' · '+date(r.date)+' · '+esc(r.detail||'Sem detalhes')+'</div></div><span class="pill '+(r.status==='Concluída'?'ready':r.status==='Cancelada'?'off':'pending')+'">'+esc(r.status)+'</span><div style="display:flex;flex-wrap:wrap;gap:6px">'+((r.kind==='Produção'||String(r.area||'').includes('Dark Factory')||String(r.area||'').includes('Marketing'))&&!r.linkedJobId?'<button class="btn gold" data-dispatch-request="'+esc(r.id)+'">Enviar à Dark Factory</button>':'')+'<button class="btn" data-done="'+esc(r.id)+'" '+(terminal?'disabled':'')+'>Concluir</button><button class="btn" data-cancel-request="'+esc(r.id)+'" '+(terminal?'disabled':'')+'>Cancelar</button><button class="btn" data-delete-request="'+esc(r.id)+'">Excluir</button></div></div>'}).join('')+'</div>'}
function overview(){const pending=requests.filter(r=>!['Concluída','Cancelada'].includes(r.status)).length,worldBalance=ledger.reduce((s,e)=>s+(e.type==='in'?e.amount:-e.amount),0),openTransfers=transfers.filter(t=>t.status==='Aguardando decisão').length;return head('Centro de comando','O mundo está em movimento.','Acompanhe as operações, abra setores e transforme necessidades em trabalho rastreável.')+'<div class="grid stats">'+stat('Intenções abertas',pending,'Solicitações aguardando conclusão',pending?'gold-text':'')+stat('Setores visíveis','7','Módulos do mundo')+stat('Saldo registrado',money(worldBalance),'Somente lançamentos manuais locais',worldBalance<0?'red-text':'green-text')+stat('Repasses propostos',openTransfers,'Aguardam decisão fora do WordDark',openTransfers?'gold-text':'')+'</div><div class="section-head"><h2>Entrar em uma área</h2><span>Selecione para abrir</span></div><div class="grid three">'+module('management','▦','Gerenciamento','Ordens de trabalho, prioridades e autorizações.')+module('sky','☁','Céu','Dark Factory, Marketing e execução de soluções.')+module('earth','◉','Terra','Empresas, canais, clientes e necessidades.')+module('finance','▣','Financeira','Cofre operacional, entradas, saídas e repasses.')+module('library','▤','Biblioteca','Memória local, notas e histórico do mundo.')+module('security','⛨','Segurança','Limites de autoridade e estado das integrações.')+'</div><div class="section-head"><h2>Aplicativos empresariais</h2><span>Operações independentes</span></div><div class="grid two">'+module('channels','▶','Gestão de canais e conteúdo','Primeira operação: organizar pedidos, planejamento e produção de conteúdo.','Alfa funcional local','pending')+module('commerce','◇','Empresa comercial','Estrutura inicial para catálogo, pedidos, fornecedores e clientes.','Estrutura inicial','pending')+'</div><div class="section-head"><h2>Atividade recente</h2><span>'+requests.length+' registros</span></div>'+reqList(4)}
function management(){return head('Coordenação central','Gerenciamento','Toda necessidade entra como uma intenção. O mundo organiza, encaminha, acompanha e registra o resultado.')+'<div class="notice"><strong>Regra de operação:</strong> uma intenção registrada não significa que a tarefa externa já foi executada. Conclusões nesta alfa são manuais e locais; nenhuma publicação, compra ou ação real é disparada automaticamente.</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>CRIAR INTENÇÃO</h3><form id="requestForm"><div class="field"><label for="rTitle">O que precisa acontecer?</label><input id="rTitle" maxlength="120" required placeholder="Ex.: planejar 3 vídeos para um produto"></div><div class="form-grid"><div class="field"><label for="rKind">Tipo</label><select id="rKind"><option>Produção</option><option>Operação</option><option>Pesquisa</option><option>Correção</option><option>Financeira</option></select></div><div class="field"><label for="rArea">Destino</label><select id="rArea"><option>Céu / Dark Factory</option><option>Céu / Marketing</option><option>Terra / Gestão de canais</option><option>Terra / Comercial</option><option>WordDark / Auditoria</option></select></div></div><div class="field"><label for="rDate">Prazo desejado</label><input id="rDate" type="date"></div><div class="field"><label for="rDetail">Contexto e resultado esperado</label><textarea id="rDetail" maxlength="1200" placeholder="Descreva o que seria uma entrega válida..."></textarea></div><button class="btn gold" type="submit">Registrar intenção</button></form></div><div class="card"><h3>CAMINHO DA INTENÇÃO</h3>'+['01 · Receber e identificar','02 · Definir setor responsável','03 · Verificar autorização e riscos','04 · Encaminhar pela Rodovia','05 · Executar por módulos','06 · Validar e auditar resultado','07 · Guardar na Biblioteca','08 · Devolver resposta'].map((x,i)=>'<div class="rowline"><span>'+x+'</span><span class="pill '+(i===0?'ready':'off')+'">'+(i===0?'Disponível':'Estrutura prevista')+'</span></div>').join('')+'</div></div><div class="section-head"><h2>Fila de trabalho</h2><span>Registros salvos neste navegador</span></div>'+reqList()}
function sky(){return head('Céu · soluções','Produção e inteligência','O Céu reúne os setores que transformam necessidades em soluções, materiais e planos de execução.')+'<div class="grid two">'+module('workbench','▧','Dark Factory','Planejamento e produção modular de conteúdo.','Abrir bancada','pending')+module('marketing','✳','Marketing','Identidade, pesquisa de tendências, ganchos e estratégia de distribuição.','Abrir setor','pending')+module('management','⌘','Laboratório de testes','Testes simulados antes de qualquer execução real.','Manual / simulado','pending')+module('library','▤','Base de conhecimento','Modelos, resultados, decisões e aprendizados.','Armazenamento local','pending')+'</div><div class="section-head"><h2>Portão de produção</h2><span>Escopo e validação</span></div><div class="card"><div class="rowline"><span>Receber pedido</span><span class="pill ready">Disponível</span></div><div class="rowline"><span>Escolher operação isolada ou produção completa</span><span class="pill pending">Planejado</span></div><div class="rowline"><span>Verificação de direitos autorais e políticas por plataforma</span><span class="pill pending">Planejado</span></div><div class="rowline"><span>Conexão e publicação em redes reais</span><span class="pill off">Desativada</span></div></div>'}
function earth(){return head('Terra · operações','Empresas e população','A Terra representa a atividade real: empresas, canais, clientes, fornecedores e necessidades que alimentam o mundo.')+'<div class="grid two">'+module('channels','▶','Empresa de gestão de canais sociais','Operação inicial: gestão completa de canais e criação de conteúdo.','Primeira prioridade','pending')+module('commerce','◇','Empresa comercial','Futura operação de produtos físicos e digitais, lojas, pedidos e fornecedores.','Próxima operação','pending')+'</div><div class="section-head"><h2>Fluxo de necessidades</h2><span>Da solicitação à entrega</span></div><div class="card"><div class="rowline"><span>Canal ou cliente apresenta uma necessidade</span><span class="pill ready">Pode registrar</span></div><div class="rowline"><span>Gerenciamento classifica e encaminha</span><span class="pill ready">Manual local</span></div><div class="rowline"><span>Setor executor entrega e devolve evidências</span><span class="pill pending">Em construção</span></div><div class="rowline"><span>Auditoria valida e registra resultado</span><span class="pill pending">Em construção</span></div></div>'}

function workbench(){const open=contentJobs.filter(j=>!['Entregue','Cancelada'].includes(j.status)).length;return head('Dark Factory · módulo de execução','Bancada de conteúdo','Crie um trabalho, escolha entre operação isolada e produção completa, registre a entrega e passe por revisão antes de marcar como aprovada.')+'<div class="notice"><strong>Execução local da V1:</strong> esta bancada organiza briefing, texto, direitos e aprovação. Ela não gera mídia automaticamente, não consulta tendências ao vivo e não publica em redes sociais. O que você registrar fica neste navegador.</div><div class="grid stats" style="margin-top:14px">'+stat('Trabalhos registrados',contentJobs.length,'Briefings e entregas')+stat('Em aberto',open,'Ainda não entregues',open?'gold-text':'')+stat('Aguardando revisão',contentJobs.filter(j=>j.status==='Em revisão').length,'Precisam de conferência')+stat('Aprovados/entregues',contentJobs.filter(j=>['Aprovado','Entregue'].includes(j.status)).length,'Com aprovação manual','green-text')+'</div><div class="card" style="margin-top:14px"><h3>MISSÃO DE ESTREIA · WORDDARK OFICIAL</h3><p class="sub">Cria um rascunho completo com roteiro principal, Short, descrição e comentário fixado. Não publica nem aprova as revisões automaticamente.</p><button class="btn gold" data-create-launch-mission>Preparar conteúdo de estreia</button></div><div class="grid two" style="margin-top:14px"><div class="card"><h3>NOVO TRABALHO DE CONTEÚDO</h3><form id="contentForm"><div class="field"><label for="cTitle">Título interno</label><input id="cTitle" maxlength="120" required placeholder="Ex.: apresentação do canal WordDark"></div><div class="form-grid"><div class="field"><label for="cMode">Escopo</label><select id="cMode"><option value="Operação isolada">Operação isolada</option><option value="Produção completa">Produção completa</option></select></div><div class="field"><label for="cPlatform">Destino pretendido</label><select id="cPlatform"><option>YouTube</option><option>Instagram</option><option>TikTok</option><option>Facebook</option><option>Site / blog</option><option>Multiplataforma</option><option>Sem publicação</option></select></div></div><div class="field"><label for="cGoal">Objetivo</label><input id="cGoal" maxlength="220" required placeholder="O que o conteúdo deve alcançar?"></div><div class="form-grid"><div class="field"><label for="cAudience">Público</label><input id="cAudience" maxlength="160" placeholder="Para quem?"></div><div class="field"><label for="cTone">Tom / identidade</label><input id="cTone" maxlength="100" placeholder="Ex.: direto, curioso, sombrio"></div></div><div class="field"><label for="cBrief">Briefing e referências autorizadas</label><textarea id="cBrief" maxlength="2500" placeholder="Informações, limites, chamada para ação e referências que você pode usar..."></textarea></div><button class="btn gold" type="submit">Criar trabalho</button></form></div><div class="card"><h3>LINHA DE PRODUÇÃO</h3>'+[['01','Receber briefing e definir escopo'],['02','Preparar roteiro, texto ou operação isolada'],['03','Registrar a entrega produzida'],['04','Verificar direitos e regras da plataforma'],['05','Revisar e aprovar manualmente'],['06','Marcar como entregue e arquivar']].map((a,i)=>'<div class="rowline"><span>'+a[0]+' · '+a[1]+'</span><span class="pill '+(i===0?'ready':'pending')+'">'+(i===0?'Disponível':'V1')+'</span></div>').join('')+'<p class="sub" style="margin-top:12px">A produção completa é um plano de etapas; a operação isolada executa apenas uma função. Ambas deixam registro próprio.</p></div></div><div class="section-head"><h2>Fila de trabalhos</h2><span>'+contentJobs.length+' registros locais</span></div>'+(contentJobs.length?'<div class="list">'+contentJobs.slice().reverse().map(j=>'<div class="item"><div class="module-icon">▧</div><div class="item-main"><div class="item-title">'+esc(j.title)+'</div><div class="item-meta">'+esc(j.mode)+' · '+esc(j.platform)+' · '+esc(j.goal)+' · '+new Date(j.createdAt).toLocaleDateString('pt-BR')+'</div></div><span class="pill '+(['Aprovado','Entregue'].includes(j.status)?'ready':'pending')+'">'+esc(j.status)+'</span><div style="display:flex;flex-wrap:wrap;gap:6px"><button class="btn" data-export-job="'+esc(j.id)+'">Exportar pacote</button><button class="btn" data-open-job="'+esc(j.id)+'">Abrir</button><button class="btn" data-cancel-job="'+esc(j.id)+'" '+(['Entregue','Cancelada'].includes(j.status)?'disabled':'')+'>Cancelar</button><button class="btn" data-delete-job="'+esc(j.id)+'">Excluir</button></div></div>').join('')+'</div>':empty('Nenhum trabalho de conteúdo criado. Comece pelo briefing acima.'))+(contentJobs.some(j=>j.id===activeJobId)?jobEditor(contentJobs.find(j=>j.id===activeJobId)):'')}

function canDispatchRequest(r){return Boolean(r&&!r.linkedJobId&&!['Concluída','Cancelada'].includes(r.status)&&(r.kind==='Produção'||String(r.area||'').includes('Dark Factory')||String(r.area||'').includes('Marketing')))}
function dispatchRequest(id){const r=requests.find(x=>x.id===id);if(!canDispatchRequest(r)){toast('Esta intenção já foi encaminhada ou não pertence ao fluxo de conteúdo.');return}const now=new Date().toISOString();const job={id:'CT-'+Date.now().toString(36).toUpperCase(),requestId:r.id,title:r.title,mode:r.kind==='Produção'?'Produção completa':'Operação isolada',platform:'A definir',goal:r.title,audience:'',tone:'',brief:['Solicitação de origem: '+r.id,'Área solicitada: '+(r.area||'Não definida'),'Tipo de intenção: '+(r.kind||'Não definido'),'Prazo desejado: '+(r.date||'Não informado'),'Contexto e resultado esperado:',r.detail||'Não informado'].join('\n'),output:'',status:'Briefing',rightsChecked:false,policyChecked:false,createdAt:now,updatedAt:now};contentJobs.push(job);r.linkedJobId=job.id;r.status='Em execução na Dark Factory';r.dispatchedAt=now;write(KEYS.contentJobs,contentJobs);write(KEYS.requests,requests);activeJobId=job.id;navigate('workbench');toast('Intenção encaminhada; revise o briefing na Dark Factory.')}
function createLaunchMission(){const existing=contentJobs.find(j=>j.missionKey==='worddark-intro-v1'&&!['Cancelada'].includes(j.status));if(existing){activeJobId=existing.id;navigate('workbench');toast('A missão de estreia já existe; abrindo o rascunho existente.');return}const now=new Date().toISOString();const output=['WORDDARK — CONTEÚDO DE ESTREIA V1','','FORMATO PRINCIPAL · VÍDEO DE APRESENTAÇÃO (45–60 SEGUNDOS)','[ABERTURA — fundo escuro; identidade do canal]','E se uma ideia pudesse deixar de ser só uma ideia e virar uma operação organizada?','','[NARRAÇÃO]','Este é o WordDark: um projeto para conectar necessidades, soluções e execução em um mesmo mundo operacional.','','[TRINDADE VISUAL — WordDark / Terra / Céu]','O WordDark coordena o caminho. A Terra representa as necessidades e os negócios do mundo real. O Céu reúne criação, estratégia e soluções — começando pela Dark Factory e pelo Marketing.','','[CENAS DE INTERFACE — mostrar apenas telas reais disponíveis, sem simular integrações inexistentes]','A proposta é transformar pedidos em etapas rastreáveis: receber, organizar, produzir, revisar e devolver uma entrega. Cada parte deve poder evoluir sem obrigar todas as outras a parar.','','[FECHAMENTO]','Este é o começo. Vamos construir, testar e mostrar cada etapa conforme ela se tornar real. Bem-vindo ao WordDark.','','TEXTO FINAL NA TELA','WORDDARK · Um mundo. Intenções em movimento.','','VERSÃO CURTA · SHORT (15–20 SEGUNDOS)','Uma ideia não precisa ficar parada. WordDark é um projeto que conecta necessidades, criação e operação: a Terra traz o que precisa ser feito, o Céu desenvolve soluções e o WordDark coordena o caminho. Este é o começo — acompanhe a construção.','','TÍTULO SUGERIDO','WordDark: um mundo para transformar intenções em operações','','DESCRIÇÃO PARA YOUTUBE','Bem-vindo ao WordDark.','Estamos construindo um mundo operacional modular para organizar necessidades, criação e execução em etapas rastreáveis.','Nesta jornada, vamos mostrar o que está sendo desenvolvido, o que já foi testado e o que ainda precisa ser conectado ao mundo real. Sem promessas mágicas: cada capacidade será apresentada conforme ficar pronta.','','TERRA · necessidades e negócios','CÉU · criação, estratégia e soluções','WORDDARK · coordenação e governança','','COMENTÁRIO FIXADO SUGERIDO','Este é o ponto de partida do WordDark. O que você gostaria de ver sendo construído primeiro: produção de conteúdo, gestão de canais ou automações comerciais?','','NOTAS DE PRODUÇÃO','- Usar somente telas, gravações e materiais próprios ou autorizados.','- Não exibir e-mails, tokens, IDs privados, painéis de cobrança ou dados pessoais.','- Não sugerir que a publicação automática, OAuth ou integrações externas já estejam ativas.','- Revisar ritmo, legibilidade, direitos de uso e regras atuais do YouTube antes de publicar.'].join('\\n');const job={id:'CT-'+Date.now().toString(36).toUpperCase(),missionKey:'worddark-intro-v1',title:'Estreia oficial — apresentação do WordDark',mode:'Produção completa',platform:'YouTube',goal:'Apresentar o WordDark, sua trindade conceitual e a construção gradual da operação sem exagerar capacidades atuais.',audience:'Pessoas curiosas por tecnologia, criação de conteúdo, automação e construção de projetos digitais.',tone:'Enigmático, claro, sóbrio e honesto; identidade escura com detalhes dourados.',brief:'Missão oficial de estreia. Produzir vídeo de apresentação do projeto WordDark. A trindade a preservar: WordDark coordena; Terra representa necessidades e negócios; Céu reúne soluções, Dark Factory e Marketing. O conteúdo precisa distinguir visão futura de capacidades já implementadas. Não mostrar rosto nem expor dados pessoais ou credenciais. Usar apenas materiais próprios ou autorizados.',output,status:'Em revisão',rightsChecked:false,policyChecked:false,createdAt:now,updatedAt:now};contentJobs.push(job);activeJobId=job.id;write(KEYS.contentJobs,contentJobs);navigate('workbench');toast('Missão de estreia criada como rascunho revisável.')}\nfunction exportJobPackage(id){const j=contentJobs.find(x=>x.id===id);if(!j){toast('Trabalho não encontrado.');return}const lines=['# Pacote de entrega WordDark','','ID: '+j.id,'Solicitação de origem: '+(j.requestId||'Trabalho criado diretamente'),'Título: '+(j.title||''),'Etapa: '+(j.status||'Briefing'),'Destino pretendido: '+(j.platform||'Não definido'),'Escopo: '+(j.mode||'Não definido'),'Criado em: '+(j.createdAt||'Não informado'),'Atualizado em: '+(j.updatedAt||'Não informado'),'','## Objetivo',j.goal||'Não informado','','## Público',j.audience||'Não informado','','## Tom / identidade',j.tone||'Não informado','','## Briefing e referências autorizadas',j.brief||'Não informado','','## Entrega produzida',j.output||'Ainda sem entrega registrada.','','## Revisão manual','- Direitos de uso conferidos: '+(j.rightsChecked?'Sim':'Não'),'- Regras da plataforma conferidas: '+(j.policyChecked?'Sim':'Não'),'','## Limite operacional','Este pacote é uma exportação para revisão ou transferência manual. Exportar não publica conteúdo nem confirma autorização legal.'].join('\n');const safe=String(j.title||j.id).replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||j.id;const blob=new Blob([lines],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='worddark-'+safe+'-pacote.md';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Pacote exportado para transferência manual.')}
function jobEditor(j){return '<div class="section-head"><h2>Editar entrega</h2><span>'+esc(j.id)+'</span></div><button class="btn" data-export-job="'+esc(j.id)+'">Exportar pacote de entrega</button><div class="card"><div class="grid two"><div><div class="field"><label for="jOutput">Texto / resultado produzido</label><textarea id="jOutput" maxlength="10000" rows="9" placeholder="Escreva ou cole aqui o resultado produzido...">'+esc(j.output||'')+'</textarea></div><button class="btn gold" data-save-output="'+esc(j.id)+'">Salvar entrega</button></div><div><h3>REVISÃO E LIBERAÇÃO</h3><div class="field"><label><input id="jRights" type="checkbox" '+(j.rightsChecked?'checked':'')+'> Confirmei os direitos de uso dos materiais e referências</label></div><div class="field"><label><input id="jPolicy" type="checkbox" '+(j.policyChecked?'checked':'')+'> Revisei as regras da plataforma de destino</label></div><div class="field"><label for="jStatus">Etapa</label><select id="jStatus">'+['Briefing','Em produção','Em revisão','Aprovado','Entregue'].map(s=>'<option '+(j.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><p class="sub">Para marcar como Aprovado ou Entregue, é necessário marcar os dois itens de revisão. Isso é uma trava de fluxo local, não uma certificação legal nem autorização de publicação externa.</p><button class="btn" data-save-review="'+esc(j.id)+'">Salvar revisão e etapa</button></div></div></div>'}

function businessStore(kind){const cfg={catalog:{title:'Catálogo de produtos',desc:'Cadastre produtos e preços pretendidos. O registro não publica o produto em lojas.',key:KEYS.catalog,rows:catalog,fields:[['name','Nome do produto','text'],['category','Categoria','text'],['price','Preço pretendido (R$)','number'],['cost','Custo estimado (R$)','number']]},suppliers:{title:'Fornecedores',desc:'Registre contatos comerciais e condições informadas; valide dados antes de qualquer compra.',key:KEYS.suppliers,rows:suppliers,fields:[['name','Nome / empresa','text'],['contact','Contato','text'],['terms','Prazo / condições','text']]},orders:{title:'Pedidos',desc:'Controle manual inicial. Nenhum pedido ou pagamento é enviado a terceiros.',key:KEYS.orders,rows:orders,fields:[['reference','Referência do pedido','text'],['customer','Cliente (nome ou código)','text'],['status','Estado','select'],['value','Valor estimado (R$)','number']]},customers:{title:'Clientes',desc:'Armazene somente dados necessários e autorizados. Evite informações sensíveis.',key:KEYS.customers,rows:customers,fields:[['name','Nome / identificador','text'],['contact','Contato autorizado','text'],['notes','Observação comercial','text']]}}[kind];if(!cfg)return commercialRules();const inputs=cfg.fields.map(([id,label,type])=>'<div class="field"><label for="biz-'+id+'">'+label+'</label>'+(type==='select'?'<select id="biz-'+id+'" name="'+id+'"><option>Recebido</option><option>Em preparação</option><option>Concluído</option><option>Cancelado</option></select>':'<input id="biz-'+id+'" name="'+id+'" type="'+type+'" maxlength="180" '+(type==='number'?'min="0" max="999999999" step=".01"':'')+' required placeholder="'+label+'">')+'</div>').join('');return head('Empresa comercial · V1',cfg.title,cfg.desc,'<button class="btn" data-go="commerce">← Empresa comercial</button>')+'<div class="grid two"><div class="card"><h3>NOVO REGISTRO</h3><form id="bizForm" data-kind="'+kind+'">'+inputs+'<button class="btn gold" type="submit">Salvar registro local</button></form></div><div class="card"><h3>LIMITES DO MÓDULO</h3><div class="rowline"><span>Persistência</span><span class="pill ready">Este navegador</span></div><div class="rowline"><span>Sincronização entre dispositivos</span><span class="pill pending">Não disponível</span></div><div class="rowline"><span>Integração externa / venda real</span><span class="pill off">Desativada</span></div><p class="sub">Use dados de teste nesta versão. Não cadastre dados de pagamento ou informações pessoais desnecessárias.</p></div></div><div class="section-head"><h2>Registros</h2><span>'+cfg.rows.length+' itens</span></div>'+(cfg.rows.length?'<div class="list">'+cfg.rows.slice().reverse().map(row=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(row.name||row.reference||'Registro')+'</div><div class="item-meta">'+cfg.fields.map(([id,label])=>label+': '+(id==='price'||id==='cost'||id==='value'?money(row[id]):esc(row[id]||'—')).replace(/^/, '')).join(' · ')+'</div></div><button class="btn" data-delete-business="'+kind+'" data-id="'+esc(row.id)+'">Excluir</button></div>').join('')+'</div>':empty('Nenhum registro. Use o formulário para criar o primeiro.'))}
function costs(){return head('Empresa comercial · análise','Custos e margem','Estimativa simples baseada nos produtos cadastrados. Não inclui impostos, taxas, frete ou outros custos que você não informar.')+'<div class="card"><h3>ESTIMATIVAS POR PRODUTO</h3>'+(catalog.length?'<div class="list">'+catalog.map(p=>{const price=Number(p.price||0),cost=Number(p.cost||0),margin=price-cost,pct=price>0?margin/price*100:0;return '<div class="item"><div class="item-main"><div class="item-title">'+esc(p.name)+'</div><div class="item-meta">Preço: '+money(price)+' · Custo informado: '+money(cost)+' · Diferença bruta: '+money(margin)+' · Margem sobre preço: '+pct.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%</div></div></div>'}).join('')+'</div>':empty('Cadastre produtos com preço e custo no Catálogo para calcular estimativas.'))+'</div><div class="notice" style="margin-top:14px">Esses cálculos são estimativas brutas e não equivalem a lucro líquido nem substituem análise contábil.</div>'}
function commercialRules(){return head('Empresa comercial · governança','Regras comerciais','Condições necessárias antes de ativar vendas e automações externas.')+'<div class="card">'+[['Cadastro de produto','Disponível localmente'],['Validação de fornecedor','Manual; ainda não verificada externamente'],['Estoque e logística','Não integrados'],['Pagamento e reembolso','Desativados'],['Loja / marketplace','Não conectado'],['Autorização de compra e venda','Exige responsável e backend seguro']].map(x=>'<div class="rowline"><span>'+x[0]+'</span><span class="pill pending">'+x[1]+'</span></div>').join('')+'</div><div class="notice danger" style="margin-top:14px">Não use esta versão para receber pagamentos, processar dados bancários ou prometer disponibilidade real de estoque.</div>'}
function marketing(){return head('Céu · inteligência de distribuição','Marketing','Identidade, posicionamento, ganchos, calendário e estratégia de distribuição para as empresas e canais.')+'<div class="grid two">'+module('workbench','✎','Preparar conteúdo','Abra a bancada para criar roteiro, texto ou pacote de produção.')+module('library','▤','Registrar pesquisa e decisões','Guarde hipóteses e referências na biblioteca local.')+'</div><div class="section-head"><h2>Rotina de marketing</h2></div><div class="card">'+[['1','Definir objetivo e público'],['2','Escolher identidade e mensagem'],['3','Criar variações de gancho e chamada'],['4','Revisar direitos e regras da plataforma'],['5','Registrar hipótese e resultado após publicação']].map(x=>'<div class="rowline"><span>'+x[0]+' · '+x[1]+'</span><span class="pill '+(x[0]==='1'?'ready':'pending')+'">'+(x[0]==='1'?'Pode iniciar':'Processo manual / futuro')+'</span></div>').join('')+'</div><div class="notice" style="margin-top:14px">Pesquisa de tendências ao vivo e métricas de contas ainda dependem de conectores reais; não serão simuladas como se estivessem conectadas.</div>'}

function finance(){const bal=ledger.reduce((s,e)=>s+(e.type==='in'?e.amount:-e.amount),0),ins=ledger.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0),outs=ledger.filter(e=>e.type==='out').reduce((s,e)=>s+e.amount,0);return head('Financeira do mundo','Cofre, resultado e repasses','A primeira camada financeira pertence às operações do WordDark. Ela registra entradas, saídas, resultado e propostas de repasse sem acesso direto ao financeiro privado.')+'<div class="notice"><strong>Separação de patrimônio:</strong> o Cofre do WordDark registra somente valores informados. A financeira privada do Ruan não é controlada por esta tela. Repasses abaixo são propostas pendentes, nunca transferências reais.</div><div class="grid stats" style="margin-top:14px">'+stat('Cofre do mundo',money(bal),'Saldo calculado dos registros',bal<0?'red-text':'green-text')+stat('Entradas',money(ins),'Total registrado','green-text')+stat('Saídas',money(outs),'Total registrado','red-text')+stat('Resultado registrado',money(ins-outs),'Entradas menos saídas',(ins-outs)<0?'red-text':'green-text')+'</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>REGISTRAR MOVIMENTO DO MUNDO</h3><form id="ledgerForm"><div class="field"><label for="lDesc">Descrição</label><input id="lDesc" maxlength="100" required placeholder="Ex.: receita da operação"></div><div class="form-grid"><div class="field"><label for="lType">Tipo</label><select id="lType"><option value="in">Entrada</option><option value="out">Saída</option></select></div><div class="field"><label for="lAmount">Valor (R$)</label><input id="lAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div></div><button class="btn gold" type="submit">Registrar no Cofre</button></form></div><div class="transfer"><h3>PROPOR REPASSE AO FINANCEIRO PRIVADO</h3><p>Esta ação registra uma proposta. Não movimenta dinheiro nem acessa a conta privada. A aprovação deverá ocorrer numa camada separada do Ruan, com confirmação explícita.</p><form id="transferForm"><div class="field"><label for="tAmount">Valor proposto (R$)</label><input id="tAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div><div class="field"><label for="tReason">Motivo / origem</label><input id="tReason" maxlength="160" required placeholder="Ex.: distribuição de lucro validado"></div><button class="btn gold" type="submit">Criar proposta de repasse</button></form></div></div><div class="section-head"><h2>Histórico do Cofre</h2><span>'+ledger.length+' registros</span></div>'+(ledger.length?'<div class="card"><table class="table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>'+ledger.slice().reverse().map(e=>'<tr><td>'+esc(e.desc)+'</td><td>'+esc(e.type==='in'?'Entrada':'Saída')+'</td><td class="'+(e.type==='in'?'green-text':'red-text')+'">'+(e.type==='in'?'+ ':'− ')+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div>':empty('O cofre do mundo ainda não tem lançamentos.'))+'<div class="section-head"><h2>Propostas de repasse</h2><span>'+transfers.length+' propostas</span></div>'+(transfers.length?'<div class="list">'+transfers.slice().reverse().map(t=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(t.reason)+'</div><div class="item-meta">Destino: Financeiro privado do Ruan · '+new Date(t.createdAt).toLocaleString('pt-BR')+'</div></div><strong>'+money(t.amount)+'</strong><span class="pill pending">'+esc(t.status)+'</span></div>').join('')+'</div>':empty('Nenhuma proposta criada.'))}
function library(){return head('Memória do mundo','Biblioteca','Registre decisões e informações que o mundo deve conservar neste navegador. Isto ainda não é uma biblioteca central sincronizada.')+'<div class="grid two"><div class="card"><h3>NOVA NOTA OPERACIONAL</h3><form id="noteForm"><div class="field"><label for="nTitle">Título</label><input id="nTitle" maxlength="120" required placeholder="Ex.: decisão de arquitetura"></div><div class="field"><label for="nBody">Conteúdo</label><textarea id="nBody" maxlength="3000" required placeholder="Decisão, contexto e próximo passo..."></textarea></div><button class="btn gold" type="submit">Guardar na biblioteca</button></form></div><div class="card"><h3>PRINCÍPIOS ARMAZENADOS NESTA ALFA</h3>'+['Ruan permanece externo e soberano sobre o WordDark.','Nenhuma empresa deve precisar parar para evoluir outra.','Funções executáveis devem ser modulares.','Dinheiro do mundo e dinheiro privado são separados.','Tela existente não significa integração real.'].map(x=>'<div class="rowline"><span>'+x+'</span><span class="pill ready">Regra</span></div>').join('')+'</div></div><div class="section-head"><h2>Notas</h2><span>'+notes.length+' registros</span></div>'+(notes.length?'<div class="list">'+notes.slice().reverse().map(n=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(n.title)+'</div><div class="item-meta">'+esc(n.body)+'</div></div><button class="btn" data-delete-note="'+esc(n.id)+'">Excluir</button></div>').join('')+'</div>':empty('Nenhuma nota na biblioteca.'))}
function security(){return head('Limites e proteção','Segurança e autoridade','A autoridade é separada por camadas. O WordDark não pode elevar seus próprios privilégios nem assumir o núcleo pessoal do Ruan.')+'<div class="grid two">'+[['ADM Dono','Camada externa soberana. Não é administrada pelo WordDark.'],['ADM','Administração interna dentro dos limites definidos pelo ADM Dono.'],['DEV','Desenvolvimento e testes; não implica poder administrativo.'],['Público','Somente interfaces e serviços autorizados para exposição.']].map(a=>'<div class="card"><span class="pill ready">Camada definida</span><h3 style="margin-top:12px">'+a[0]+'</h3><p class="sub">'+a[1]+'</p></div>').join('')+'</div><div class="section-head"><h2>Estado técnico desta versão</h2></div><div class="card">'+[['Armazenamento','Local neste navegador'],['Autenticação segura','Ainda não implementada'],['Permissões de servidor','Ainda não implementadas'],['Conectores de redes sociais','Desativados'],['Banco real / pagamentos','Não conectado'],['Auditoria inviolável','Ainda não implementada']].map(a=>'<div class="rowline"><span>'+a[0]+'</span><span class="pill '+(a[1].startsWith('Local')?'ready':'pending')+'">'+a[1]+'</span></div>').join('')+'</div><div class="notice danger" style="margin-top:14px">Este protótipo não é uma fronteira de segurança para produção. O armazenamento local pode ser editado pelo próprio usuário ou perdido ao limpar os dados do navegador. Autorização real exige backend, identidade, políticas de acesso e registros auditáveis.</div>'}
function render(){const views={overview,management,sky,earth,finance,library,security,channels,workbench,commerce,marketing,catalog:()=>businessStore('catalog'),suppliers:()=>businessStore('suppliers'),orders:()=>businessStore('orders'),customers:()=>businessStore('customers'),costs,commercialRules};$('screen').innerHTML=views[page]();bindScreen()}
function bindScreen(){document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));document.querySelectorAll('[data-open-job]').forEach(b=>b.addEventListener('click',()=>{activeJobId=b.dataset.openJob;render()}));
document.querySelectorAll('[data-dispatch-request]').forEach(b=>b.addEventListener('click',()=>dispatchRequest(b.dataset.dispatchRequest)));document.querySelectorAll('[data-create-launch-mission]').forEach(b=>b.addEventListener('click',createLaunchMission));
document.querySelectorAll('[data-cancel-request]').forEach(b=>b.addEventListener('click',()=>{const item=requests.find(x=>x.id===b.dataset.cancelRequest);if(!item||['Concluída','Cancelada'].includes(item.status))return;if(confirm('Cancelar esta operação? Ela continuará registrada como Cancelada no histórico local.')){item.status='Cancelada';item.cancelledAt=new Date().toISOString();write(KEYS.requests,requests);render();toast('Operação cancelada; o registro foi mantido no histórico.')}}));
document.querySelectorAll('[data-delete-request]').forEach(b=>b.addEventListener('click',()=>{const item=requests.find(x=>x.id===b.dataset.deleteRequest);if(!item)return;if(confirm('Excluir esta operação permanentemente deste navegador? Esta ação não pode ser desfeita.')){requests=requests.filter(x=>x.id!==b.dataset.deleteRequest);write(KEYS.requests,requests);render();toast('Operação excluída deste navegador.')}}));
document.querySelectorAll('[data-cancel-job]').forEach(b=>b.addEventListener('click',()=>{const job=contentJobs.find(x=>x.id===b.dataset.cancelJob);if(!job||['Entregue','Cancelada'].includes(job.status))return;if(confirm('Cancelar este trabalho? Ele continuará no histórico como Cancelada.')){job.status='Cancelada';job.cancelledAt=new Date().toISOString();job.updatedAt=new Date().toISOString();if(job.requestId){const linked=requests.find(r=>r.id===job.requestId);if(linked&&linked.status==='Em execução na Dark Factory'){linked.status='Aberta';delete linked.linkedJobId;delete linked.dispatchedAt;write(KEYS.requests,requests)}}write(KEYS.contentJobs,contentJobs);render();toast('Trabalho cancelado e mantido no histórico.')}}));
document.querySelectorAll('[data-delete-job]').forEach(b=>b.addEventListener('click',()=>{const job=contentJobs.find(x=>x.id===b.dataset.deleteJob);if(!job)return;if(confirm('Excluir este trabalho e seus dados permanentemente deste navegador? Esta ação não pode ser desfeita.')){contentJobs=contentJobs.filter(x=>x.id!==b.dataset.deleteJob);if(activeJobId===b.dataset.deleteJob)activeJobId=null;write(KEYS.contentJobs,contentJobs);render();toast('Trabalho excluído deste navegador.')}}));document.querySelectorAll('[data-export-job]').forEach(b=>b.addEventListener('click',()=>exportJobPackage(b.dataset.exportJob)));document.querySelectorAll('[data-save-output]').forEach(b=>b.addEventListener('click',()=>{const j=contentJobs.find(x=>x.id===b.dataset.saveOutput);if(!j)return;j.output=$('jOutput').value; j.updatedAt=new Date().toISOString();write(KEYS.contentJobs,contentJobs);render();toast('Entrega salva no trabalho local.')}));document.querySelectorAll('[data-save-review]').forEach(b=>b.addEventListener('click',()=>{const j=contentJobs.find(x=>x.id===b.dataset.saveReview);if(!j)return;const status=$('jStatus').value,rights=$('jRights').checked,policy=$('jPolicy').checked;if(['Aprovado','Entregue'].includes(status)&&!String(j.output||'').trim()){toast('Registre e salve a entrega antes de aprovar ou concluir.');return}if(['Aprovado','Entregue'].includes(status)&&(!rights||!policy)){toast('Marque a revisão de direitos e de plataforma antes de aprovar.');return}j.rightsChecked=rights;j.policyChecked=policy;j.status=status;j.updatedAt=new Date().toISOString();j.approvedAt=status==='Aprovado'||status==='Entregue'?new Date().toISOString():null;if(j.requestId){const linked=requests.find(r=>r.id===j.requestId);if(linked){linked.status=status==='Entregue'?'Concluída':status==='Cancelada'?'Cancelada':'Em execução na Dark Factory';if(status==='Entregue')linked.completedAt=j.updatedAt;write(KEYS.requests,requests)}}write(KEYS.contentJobs,contentJobs);render();toast(status==='Entregue'?'Entrega registrada; intenção de origem concluída localmente.':'Revisão registrada. Nenhuma publicação externa foi feita.')}));const cf=$('contentForm');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const title=$('cTitle').value.trim(),goal=$('cGoal').value.trim();if(!title||!goal)return;const job={id:'CT-'+Date.now().toString(36).toUpperCase(),title,mode:$('cMode').value,platform:$('cPlatform').value,goal,audience:$('cAudience').value.trim(),tone:$('cTone').value.trim(),brief:$('cBrief').value.trim(),output:'',status:'Briefing',rightsChecked:false,policyChecked:false,createdAt:new Date().toISOString()};contentJobs.push(job);activeJobId=job.id;write(KEYS.contentJobs,contentJobs);render();toast('Trabalho criado. Abra a entrega para continuar.')});document.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{const r=requests.find(x=>x.id===b.dataset.done);if(r){r.status='Concluída';r.completedAt=new Date().toISOString();write(KEYS.requests,requests);render();toast('Registro marcado como concluído localmente.')}}));document.querySelectorAll('[data-delete-note]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Excluir esta nota?')){notes=notes.filter(n=>n.id!==b.dataset.deleteNote);write(KEYS.notes,notes);render()}}));
const bf=$('bizForm');if(bf)bf.addEventListener('submit',e=>{e.preventDefault();const kind=bf.dataset.kind,sets={catalog:{key:KEYS.catalog,rows:catalog},suppliers:{key:KEYS.suppliers,rows:suppliers},orders:{key:KEYS.orders,rows:orders},customers:{key:KEYS.customers,rows:customers}},set=sets[kind];if(!set)return;const record={id:'CM-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString()};new FormData(bf).forEach((v,k)=>record[k]=String(v).trim());if(!Object.values(record).some((v,k)=>k!=='id'&&k!=='createdAt'&&String(v).trim()))return;set.rows.push(record);if(write(set.key,set.rows)){render();toast('Registro salvo neste navegador.')}});document.querySelectorAll('[data-delete-business]').forEach(b=>b.addEventListener('click',()=>{const sets={catalog:{key:KEYS.catalog,rows:catalog},suppliers:{key:KEYS.suppliers,rows:suppliers},orders:{key:KEYS.orders,rows:orders},customers:{key:KEYS.customers,rows:customers}},set=sets[b.dataset.deleteBusiness];if(!set)return;if(confirm('Excluir este registro local?')){set.rows.splice(0,set.rows.length,...set.rows.filter(x=>x.id!==b.dataset.id));if(write(set.key,set.rows))render()}}));const rf=$('requestForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();const title=$('rTitle').value.trim();if(!title)return;requests.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,kind:$('rKind').value,area:$('rArea').value,date:$('rDate').value,detail:$('rDetail').value.trim(),status:'Aberta',createdAt:new Date().toISOString()});write(KEYS.requests,requests);render();toast('Intenção registrada no ambiente local.')});
const lf=$('ledgerForm');if(lf)lf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('lAmount').value),desc=$('lDesc').value.trim();if(!desc||!Number.isFinite(amount)||amount<=0)return;ledger.push({id:String(Date.now()),desc,amount,type:$('lType').value,createdAt:new Date().toISOString()});write(KEYS.ledger,ledger);render();toast('Lançamento adicionado ao Cofre do mundo.')});
const tf=$('transferForm');if(tf)tf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('tAmount').value),reason=$('tReason').value.trim();if(!reason||!Number.isFinite(amount)||amount<=0)return;transfers.push({id:String(Date.now()),amount,reason,status:'Aguardando decisão',createdAt:new Date().toISOString()});write(KEYS.transfers,transfers);render();toast('Proposta criada; nenhum dinheiro foi transferido.')});
const nf=$('noteForm');if(nf)nf.addEventListener('submit',e=>{e.preventDefault();const title=$('nTitle').value.trim(),body=$('nBody').value.trim();if(!title||!body)return;notes.push({id:String(Date.now()),title,body,createdAt:new Date().toISOString()});write(KEYS.notes,notes);render();toast('Nota guardada na biblioteca local.')})}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script></body></html>
