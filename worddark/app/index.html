/* World refresh: atmospheric backgrounds, quieter surfaces, app-launcher navigation */

function exportWorldBackup(){const collections={};for(const [name,key] of Object.entries(BACKUP_COLLECTIONS)){try{const value=JSON.parse(localStorage.getItem(key)||'[]');collections[name]=Array.isArray(value)?value:[]}catch{toast('Não foi possível ler a coleção '+name+'. Backup cancelado.');return}}const payload={app:'WordDark',formatVersion:1,exportedAt:new Date().toISOString(),collections};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='worddark-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup local exportado. Guarde o arquivo em segurança.')}
async function restoreWorldBackupFile(file){if(!file)return;if(file.size>5*1024*1024){toast('Arquivo acima de 5 MB. Restauração recusada.');return}let payload;try{payload=JSON.parse(await file.text())}catch{toast('Arquivo inválido: não é um JSON legível.');return}if(!payload||payload.app!=='WordDark'||payload.formatVersion!==1||!payload.collections||typeof payload.collections!=='object'){toast('Backup incompatível. Nenhum dado foi alterado.');return}for(const name of Object.keys(BACKUP_COLLECTIONS)){if(!Array.isArray(payload.collections[name])){toast('Backup incompleto ou inválido: '+name+'. Nenhum dado foi alterado.');return}}if(!confirm('Restaurar este backup WordDark? Isso substituirá as coleções locais atuais neste navegador. Exporte um backup atual antes se quiser preservá-lo.'))return;const previous={};try{for(const [name,key] of Object.entries(BACKUP_COLLECTIONS)){previous[key]=localStorage.getItem(key);localStorage.setItem(key,JSON.stringify(payload.collections[name]))}}catch{for(const [key,value] of Object.entries(previous)){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch{}}toast('Falha ao restaurar. Foi tentada a recuperação dos dados anteriores.');return}toast('Backup restaurado. Recarregando os dados locais.');location.reload()}

function createLaunchMission(){const existing=contentJobs.find(j=>j.missionKey==='worddark-intro-v1'&&!['Cancelada'].includes(j.status));if(existing){activeJobId=existing.id;navigate('workbench');toast('A missão de estreia já existe; abrindo o rascunho existente.');return}const now=new Date().toISOString();const output=['WORDDARK — CONTEÚDO DE ESTREIA V1','','FORMATO PRINCIPAL · VÍDEO DE APRESENTAÇÃO (45–60 SEGUNDOS)','[ABERTURA — fundo escuro; identidade do canal]','E se uma ideia pudesse deixar de ser só uma ideia e virar uma operação organizada?','','[NARRAÇÃO]','Este é o WordDark: um projeto para conectar necessidades, soluções e execução em um mesmo mundo operacional.','','[TRINDADE VISUAL — WordDark / Terra / Céu]','O WordDark coordena o caminho. A Terra representa as necessidades e os negócios do mundo real. O Céu reúne criação, estratégia e soluções — começando pela Dark Factory e pelo Marketing.','','[CENAS DE INTERFACE — mostrar apenas telas reais disponíveis, sem simular integrações inexistentes]','A proposta é transformar pedidos em etapas rastreáveis: receber, organizar, produzir, revisar e devolver uma entrega. Cada parte deve poder evoluir sem obrigar todas as outras a parar.','','[FECHAMENTO]','Este é o começo. Vamos construir, testar e mostrar cada etapa conforme ela se tornar real. Bem-vindo ao WordDark.','','TEXTO FINAL NA TELA','WORDDARK · Um mundo. Intenções em movimento.','','VERSÃO CURTA · SHORT (15–20 SEGUNDOS)','Uma ideia não precisa ficar parada. WordDark é um projeto que conecta necessidades, criação e operação: a Terra traz o que precisa ser feito, o Céu desenvolve soluções e o WordDark coordena o caminho. Este é o começo — acompanhe a construção.','','TÍTULO SUGERIDO','WordDark: um mundo para transformar intenções em operações','','DESCRIÇÃO PARA YOUTUBE','Bem-vindo ao WordDark.','Estamos construindo um mundo operacional modular para organizar necessidades, criação e execução em etapas rastreáveis.','Nesta jornada, vamos mostrar o que está sendo desenvolvido, o que já foi testado e o que ainda precisa ser conectado ao mundo real. Sem promessas mágicas: cada capacidade será apresentada conforme ficar pronta.','','TERRA · necessidades e negócios','CÉU · criação, estratégia e soluções','WORDDARK · coordenação e governança','','COMENTÁRIO FIXADO SUGERIDO','Este é o ponto de partida do WordDark. O que você gostaria de ver sendo construído primeiro: produção de conteúdo, gestão de canais ou automações comerciais?','','NOTAS DE PRODUÇÃO','- Usar somente telas, gravações e materiais próprios ou autorizados.','- Não exibir e-mails, tokens, IDs privados, painéis de cobrança ou dados pessoais.','- Não sugerir que a publicação automática, OAuth ou integrações externas já estejam ativas.','- Revisar ritmo, legibilidade, direitos de uso e regras atuais do YouTube antes de publicar.'].join('\n');const job={id:'CT-'+Date.now().toString(36).toUpperCase(),missionKey:'worddark-intro-v1',title:'Estreia oficial — apresentação do WordDark',mode:'Produção completa',platform:'YouTube',goal:'Apresentar o WordDark, sua trindade conceitual e a construção gradual da operação sem exagerar capacidades atuais.',audience:'Pessoas curiosas por tecnologia, criação de conteúdo, automação e construção de projetos digitais.',tone:'Enigmático, claro, sóbrio e honesto; identidade escura com detalhes dourados.',brief:'Missão oficial de estreia. Produzir vídeo de apresentação do projeto WordDark. A trindade a preservar: WordDark coordena; Terra representa necessidades e negócios; Céu reúne soluções, Dark Factory e Marketing. O conteúdo precisa distinguir visão futura de capacidades já implementadas. Não mostrar rosto nem expor dados pessoais ou credenciais. Usar apenas materiais próprios ou autorizados.',output,status:'Em revisão',rightsChecked:false,policyChecked:false,createdAt:now,updatedAt:now};recordJobEvent(job,'Criado','Missão de estreia gerada como rascunho; aguarda produção e revisão humana.');contentJobs.push(job);activeJobId=job.id;write(KEYS.contentJobs,contentJobs);navigate('workbench');toast('Missão de estreia criada como rascunho revisável.')}
function exportJobPackage(id){const j=contentJobs.find(x=>x.id===id);if(!j){toast('Trabalho não encontrado.');return}const lines=['# Pacote de entrega WordDark','','ID: '+j.id,'Solicitação de origem: '+(j.requestId||'Trabalho criado diretamente'),'Título: '+(j.title||''),'Etapa: '+(j.status||'Briefing'),'Destino pretendido: '+(j.platform||'Não definido'),'Escopo: '+(j.mode||'Não definido'),'Criado em: '+(j.createdAt||'Não informado'),'Atualizado em: '+(j.updatedAt||'Não informado'),'','## Objetivo',j.goal||'Não informado','','## Público',j.audience||'Não informado','','## Tom / identidade',j.tone||'Não informado','','## Briefing e referências autorizadas',j.brief||'Não informado','','## Entrega produzida',j.output||'Ainda sem entrega registrada.','','## Revisão manual','- Direitos de uso conferidos: '+(j.rightsChecked?'Sim':'Não'),'- Regras da plataforma conferidas: '+(j.policyChecked?'Sim':'Não'),'- Aprovação humana interna: '+(j.humanApproved?'Sim':'Não'),'','## Histórico de etapas',...(Array.isArray(j.history)&&j.history.length?j.history.map(e=>'- '+(e.at||'data indisponível')+' | '+(e.type||'Atualização')+' | '+(e.detail||'')):['- Sem histórico disponível para este registro legado.']),'','## Limite operacional','Este pacote é uma exportação para revisão ou transferência manual. Exportar não publica conteúdo nem confirma autorização legal.'].join('\n');const safe=String(j.title||j.id).replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60)||j.id;const blob=new Blob([lines],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='worddark-'+safe+'-pacote.md';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Pacote exportado para transferência manual.')}
function recordJobEvent(j,type,detail){if(!Array.isArray(j.history))j.history=[];const event={at:new Date().toISOString(),type:String(type||'Atualização'),detail:String(detail||'')};j.history.push(event);if(j.history.length>100)j.history=j.history.slice(-100);j.updatedAt=event.at;return event}
function renderJobHistory(j){const history=Array.isArray(j.history)?j.history:[];if(!history.length)return '<p class="sub">Nenhuma etapa auditável registrada para este trabalho legado.</p>';return '<div class="list">'+history.slice().reverse().map(e=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(e.type||'Atualização')+'</div><div class="item-meta">'+esc(e.detail||'')+' · '+esc(e.at?new Date(e.at).toLocaleString('pt-BR'):'data indisponível')+'</div></div></div>').join('')+'</div>'}
function jobEditor(j){return '<div class="section-head"><h2>Editar entrega</h2><span>'+esc(j.id)+'</span></div><button class="btn" data-export-job="'+esc(j.id)+'">Exportar pacote de entrega</button><div class="card"><div class="grid two"><div><div class="field"><label for="jOutput">Texto / resultado produzido</label><textarea id="jOutput" maxlength="10000" rows="9" placeholder="Escreva ou cole aqui o resultado produzido...">'+esc(j.output||'')+'</textarea></div><button class="btn gold" data-save-output="'+esc(j.id)+'">Salvar entrega</button></div><div><h3>REVISÃO E LIBERAÇÃO</h3><div class="field"><label><input id="jRights" type="checkbox" '+(j.rightsChecked?'checked':'')+'> Confirmei os direitos de uso dos materiais e referências</label></div><div class="field"><label><input id="jPolicy" type="checkbox" '+(j.policyChecked?'checked':'')+'> Revisei as regras da plataforma de destino</label></div><div class="field"><label><input id="jHumanApproval" type="checkbox" '+(j.humanApproved?'checked':'')+'> Revisei pessoalmente a entrega e autorizo sua aprovação interna</label></div><div class="field"><label for="jStatus">Etapa</label><select id="jStatus">'+['Briefing','Em produção','Em revisão','Aprovado','Entregue'].map(s=>'<option '+(j.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><p class="sub">A aprovação interna exige entrega salva, direitos e regras revisados e autorização humana explícita. A etapa Entregue só pode vir depois de Aprovado. Isso não publica em redes nem substitui validação legal.</p><button class="btn" data-save-review="'+esc(j.id)+'">Salvar revisão e etapa</button></div></div></div><div class="section-head"><h2>Histórico do trabalho</h2><span>'+(Array.isArray(j.history)?j.history.length:0)+' eventos</span></div>'+renderJobHistory(j)}
function commerce(){return head('Aplicativo empresarial 02','Empresa comercial','Base modular para produtos físicos e digitais. Cada área abre sua própria tela, sem mandar o usuário de volta ao mesmo painel.')+'<div class="notice"><strong>Modo V1:</strong> os cadastros abaixo são locais neste navegador. Ainda não publicam produtos nem conectam fornecedores, lojas, pedidos ou pagamentos reais.</div><div class="grid three" style="margin-top:14px">'+module('catalog','◇','Catálogo','Cadastrar produtos, categorias e preços.')+module('suppliers','▤','Fornecedores','Manter contatos e condições de fornecimento.')+module('orders','▣','Pedidos','Registrar e acompanhar pedidos manualmente.')+module('customers','♧','Clientes','Organizar contatos e histórico autorizado.')+module('costs','▥','Custos e margem','Calcular preço sugerido e margem estimada.')+module('commercialRules','⛨','Regras comerciais','Ver limites da operação e requisitos para ativação.')+'</div><div class="section-head"><h2>Base comercial local</h2></div><div class="grid stats">'+stat('Produtos',catalog.length,'Cadastros locais')+stat('Fornecedores',suppliers.length,'Cadastros locais')+stat('Pedidos',orders.length,'Registros manuais')+stat('Clientes',customers.length,'Cadastros locais')+'</div>'}

function businessStore(kind){const cfg={catalog:{title:'Catálogo de produtos',desc:'Cadastre produtos e preços pretendidos. O registro não publica o produto em lojas.',key:KEYS.catalog,rows:catalog,fields:[['name','Nome do produto','text'],['category','Categoria','text'],['price','Preço pretendido (R$)','number'],['cost','Custo estimado (R$)','number']]},suppliers:{title:'Fornecedores',desc:'Registre contatos comerciais e condições informadas; valide dados antes de qualquer compra.',key:KEYS.suppliers,rows:suppliers,fields:[['name','Nome / empresa','text'],['contact','Contato','text'],['terms','Prazo / condições','text']]},orders:{title:'Pedidos',desc:'Controle manual inicial. Nenhum pedido ou pagamento é enviado a terceiros.',key:KEYS.orders,rows:orders,fields:[['reference','Referência do pedido','text'],['customer','Cliente (nome ou código)','text'],['status','Estado','select'],['value','Valor estimado (R$)','number']]},customers:{title:'Clientes',desc:'Armazene somente dados necessários e autorizados. Evite informações sensíveis.',key:KEYS.customers,rows:customers,fields:[['name','Nome / identificador','text'],['contact','Contato autorizado','text'],['notes','Observação comercial','text']]}}[kind];if(!cfg)return commercialRules();const inputs=cfg.fields.map(([id,label,type])=>'<div class="field"><label for="biz-'+id+'">'+label+'</label>'+(type==='select'?'<select id="biz-'+id+'" name="'+id+'"><option>Recebido</option><option>Em preparação</option><option>Concluído</option><option>Cancelado</option></select>':'<input id="biz-'+id+'" name="'+id+'" type="'+type+'" maxlength="180" '+(type==='number'?'min="0" max="999999999" step=".01"':'')+' required placeholder="'+label+'">')+'</div>').join('');return head('Empresa comercial · V1',cfg.title,cfg.desc,'<button class="btn" data-go="commerce">← Empresa comercial</button>')+'<div class="grid two"><div class="card"><h3>NOVO REGISTRO</h3><form id="bizForm" data-kind="'+kind+'">'+inputs+'<button class="btn gold" type="submit">Salvar registro local</button></form></div><div class="card"><h3>LIMITES DO MÓDULO</h3><div class="rowline"><span>Persistência</span><span class="pill ready">Este navegador</span></div><div class="rowline"><span>Sincronização entre dispositivos</span><span class="pill pending">Não disponível</span></div><div class="rowline"><span>Integração externa / venda real</span><span class="pill off">Desativada</span></div><p class="sub">Use dados de teste nesta versão. Não cadastre dados de pagamento ou informações pessoais desnecessárias.</p></div></div><div class="section-head"><h2>Registros</h2><span>'+cfg.rows.length+' itens</span></div>'+(cfg.rows.length?'<div class="list">'+cfg.rows.slice().reverse().map(row=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(row.name||row.reference||'Registro')+'</div><div class="item-meta">'+cfg.fields.map(([id,label])=>label+': '+(id==='price'||id==='cost'||id==='value'?money(row[id]):esc(row[id]||'—')).replace(/^/, '')).join(' · ')+'</div></div><button class="btn" data-delete-business="'+kind+'" data-id="'+esc(row.id)+'">Excluir</button></div>').join('')+'</div>':empty('Nenhum registro. Use o formulário para criar o primeiro.'))}
function costs(){return head('Empresa comercial · análise','Custos e margem','Estimativa simples baseada nos produtos cadastrados. Não inclui impostos, taxas, frete ou outros custos que você não informar.')+'<div class="card"><h3>ESTIMATIVAS POR PRODUTO</h3>'+(catalog.length?'<div class="list">'+catalog.map(p=>{const price=Number(p.price||0),cost=Number(p.cost||0),margin=price-cost,pct=price>0?margin/price*100:0;return '<div class="item"><div class="item-main"><div class="item-title">'+esc(p.name)+'</div><div class="item-meta">Preço: '+money(price)+' · Custo informado: '+money(cost)+' · Diferença bruta: '+money(margin)+' · Margem sobre preço: '+pct.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%</div></div></div>'}).join('')+'</div>':empty('Cadastre produtos com preço e custo no Catálogo para calcular estimativas.'))+'</div><div class="notice" style="margin-top:14px">Esses cálculos são estimativas brutas e não equivalem a lucro líquido nem substituem análise contábil.</div>'}
function commercialRules(){return head('Empresa comercial · governança','Regras comerciais','Condições necessárias antes de ativar vendas e automações externas.')+'<div class="card">'+[['Cadastro de produto','Disponível localmente'],['Validação de fornecedor','Manual; ainda não verificada externamente'],['Estoque e logística','Não integrados'],['Pagamento e reembolso','Desativados'],['Loja / marketplace','Não conectado'],['Autorização de compra e venda','Exige responsável e backend seguro']].map(x=>'<div class="rowline"><span>'+x[0]+'</span><span class="pill pending">'+x[1]+'</span></div>').join('')+'</div><div class="notice danger" style="margin-top:14px">Não use esta versão para receber pagamentos, processar dados bancários ou prometer disponibilidade real de estoque.</div>'}
function marketing(){return head('Céu · inteligência de distribuição','Marketing','Identidade, posicionamento, ganchos, calendário e estratégia de distribuição para as empresas e canais.')+'<div class="grid two">'+module('workbench','✎','Preparar conteúdo','Abra a bancada para criar roteiro, texto ou pacote de produção.')+module('library','▤','Registrar pesquisa e decisões','Guarde hipóteses e referências na biblioteca local.')+'</div><div class="section-head"><h2>Rotina de marketing</h2></div><div class="card">'+[['1','Definir objetivo e público'],['2','Escolher identidade e mensagem'],['3','Criar variações de gancho e chamada'],['4','Revisar direitos e regras da plataforma'],['5','Registrar hipótese e resultado após publicação']].map(x=>'<div class="rowline"><span>'+x[0]+' · '+x[1]+'</span><span class="pill '+(x[0]==='1'?'ready':'pending')+'">'+(x[0]==='1'?'Pode iniciar':'Processo manual / futuro')+'</span></div>').join('')+'</div><div class="notice" style="margin-top:14px">Pesquisa de tendências ao vivo e métricas de contas ainda dependem de conectores reais; não serão simuladas como se estivessem conectadas.</div>'}

function finance(){const bal=ledger.reduce((s,e)=>s+(e.type==='in'?e.amount:-e.amount),0),ins=ledger.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0),outs=ledger.filter(e=>e.type==='out').reduce((s,e)=>s+e.amount,0);return head('Financeira do mundo','Cofre, resultado e repasses','A primeira camada financeira pertence às operações do WordDark. Ela registra entradas, saídas, resultado e propostas de repasse sem acesso direto ao financeiro privado.')+'<div class="notice"><strong>Separação de patrimônio:</strong> o Cofre do WordDark registra somente valores informados. A financeira privada do Ruan não é controlada por esta tela. Repasses abaixo são propostas pendentes, nunca transferências reais.</div><div class="grid stats" style="margin-top:14px">'+stat('Cofre do mundo',money(bal),'Saldo calculado dos registros',bal<0?'red-text':'green-text')+stat('Entradas',money(ins),'Total registrado','green-text')+stat('Saídas',money(outs),'Total registrado','red-text')+stat('Resultado registrado',money(ins-outs),'Entradas menos saídas',(ins-outs)<0?'red-text':'green-text')+'</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>REGISTRAR MOVIMENTO DO MUNDO</h3><form id="ledgerForm"><div class="field"><label for="lDesc">Descrição</label><input id="lDesc" maxlength="100" required placeholder="Ex.: receita da operação"></div><div class="form-grid"><div class="field"><label for="lType">Tipo</label><select id="lType"><option value="in">Entrada</option><option value="out">Saída</option></select></div><div class="field"><label for="lAmount">Valor (R$)</label><input id="lAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div></div><button class="btn gold" type="submit">Registrar no Cofre</button></form></div><div class="transfer"><h3>PROPOR REPASSE AO FINANCEIRO PRIVADO</h3><p>Esta ação registra uma proposta. Não movimenta dinheiro nem acessa a conta privada. A aprovação deverá ocorrer numa camada separada do Ruan, com confirmação explícita.</p><form id="transferForm"><div class="field"><label for="tAmount">Valor proposto (R$)</label><input id="tAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div><div class="field"><label for="tReason">Motivo / origem</label><input id="tReason" maxlength="160" required placeholder="Ex.: distribuição de lucro validado"></div><button class="btn gold" type="submit">Criar proposta de repasse</button></form></div></div><div class="section-head"><h2>Histórico do Cofre</h2><span>'+ledger.length+' registros</span></div>'+(ledger.length?'<div class="card"><table class="table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>'+ledger.slice().reverse().map(e=>'<tr><td>'+esc(e.desc)+'</td><td>'+esc(e.type==='in'?'Entrada':'Saída')+'</td><td class="'+(e.type==='in'?'green-text':'red-text')+'">'+(e.type==='in'?'+ ':'− ')+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div>':empty('O cofre do mundo ainda não tem lançamentos.'))+'<div class="section-head"><h2>Propostas de repasse</h2><span>'+transfers.length+' propostas</span></div>'+(transfers.length?'<div class="list">'+transfers.slice().reverse().map(t=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(t.reason)+'</div><div class="item-meta">Destino: Financeiro privado do Ruan · '+new Date(t.createdAt).toLocaleString('pt-BR')+'</div></div><strong>'+money(t.amount)+'</strong><span class="pill pending">'+esc(t.status)+'</span></div>').join('')+'</div>':empty('Nenhuma proposta criada.'))}
function library(){return head('Memória do mundo','Biblioteca','Registre decisões e informações que o mundo deve conservar neste navegador. Isto ainda não é uma biblioteca central sincronizada.')+'<div class="grid two"><div class="card"><h3>NOVA NOTA OPERACIONAL</h3><form id="noteForm"><div class="field"><label for="nTitle">Título</label><input id="nTitle" maxlength="120" required placeholder="Ex.: decisão de arquitetura"></div><div class="field"><label for="nBody">Conteúdo</label><textarea id="nBody" maxlength="3000" required placeholder="Decisão, contexto e próximo passo..."></textarea></div><button class="btn gold" type="submit">Guardar na biblioteca</button></form></div><div class="card"><h3>PRINCÍPIOS ARMAZENADOS NESTA ALFA</h3>'+['Ruan permanece externo e soberano sobre o WordDark.','Nenhuma empresa deve precisar parar para evoluir outra.','Funções executáveis devem ser modulares.','Dinheiro do mundo e dinheiro privado são separados.','Tela existente não significa integração real.'].map(x=>'<div class="rowline"><span>'+x+'</span><span class="pill ready">Regra</span></div>').join('')+'</div></div><div class="card" style="margin-top:14px"><h3>BACKUP E RESTAURAÇÃO LOCAL</h3><p class="sub">Exporte as coleções deste navegador para um arquivo JSON ou restaure um backup WordDark. A restauração substitui os dados locais atuais deste app.</p><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px"><button class="btn gold" data-export-backup>Exportar backup completo</button><label class="btn" for="importBackupFile">Restaurar backup</label><input id="importBackupFile" type="file" accept="application/json,.json" style="display:none"></div><p class="sub">O arquivo pode conter registros financeiros e informações privadas. Guarde-o em local seguro. Backup não sincroniza dispositivos nem substitui um servidor seguro.</p></div><div class="section-head"><h2>Notas</h2><span>'+notes.length+' registros</span></div>'+(notes.length?'<div class="list">'+notes.slice().reverse().map(n=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(n.title)+'</div><div class="item-meta">'+esc(n.body)+'</div></div><button class="btn" data-delete-note="'+esc(n.id)+'">Excluir</button></div>').join('')+'</div>':empty('Nenhuma nota na biblioteca.'))}

function render(){const views={overview,management,sky,earth,finance,library,security,channels,workbench,commerce,marketing,catalog:()=>businessStore('catalog'),suppliers:()=>businessStore('suppliers'),orders:()=>businessStore('orders'),customers:()=>businessStore('customers'),costs,commercialRules};$('screen').innerHTML=views[page]();bindScreen()}
function bindScreen(){document.querySelectorAll('[data-export-backup]').forEach(b=>b.addEventListener('click',exportWorldBackup));const backupInput=$('importBackupFile');if(backupInput)backupInput.addEventListener('change',()=>{const file=backupInput.files&&backupInput.files[0];restoreWorldBackupFile(file);backupInput.value=''});document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.go)));document.querySelectorAll('[data-open-job]').forEach(b=>b.addEventListener('click',()=>{activeJobId=b.dataset.openJob;render()}));

document.querySelectorAll('[data-delete-request]').forEach(b=>b.addEventListener('click',()=>{const item=requests.find(x=>x.id===b.dataset.deleteRequest);if(!item)return;if(confirm('Excluir esta operação permanentemente deste navegador? Esta ação não pode ser desfeita.')){requests=requests.filter(x=>x.id!==b.dataset.deleteRequest);write(KEYS.requests,requests);render();toast('Operação excluída deste navegador.')}}));
document.querySelectorAll('[data-cancel-job]').forEach(b=>b.addEventListener('click',()=>{const job=contentJobs.find(x=>x.id===b.dataset.cancelJob);if(!job||['Entregue','Cancelada'].includes(job.status))return;if(confirm('Cancelar este trabalho? Ele continuará no histórico como Cancelada.')){job.status='Cancelada';job.cancelledAt=new Date().toISOString();recordJobEvent(job,'Cancelado','Trabalho cancelado manualmente; registro mantido no histórico local.');if(job.requestId){const linked=requests.find(r=>r.id===job.requestId);if(linked&&['Encaminhada à Dark Factory','Em execução na Dark Factory','Aguardando revisão','Aprovada para entrega'].includes(linked.status)){linked.status='Aberta';delete linked.linkedJobId;delete linked.dispatchedAt;write(KEYS.requests,requests)}}write(KEYS.contentJobs,contentJobs);render();toast('Trabalho cancelado e mantido no histórico.')}}));
document.querySelectorAll('[data-delete-job]').forEach(b=>b.addEventListener('click',()=>{const job=contentJobs.find(x=>x.id===b.dataset.deleteJob);if(!job)return;if(confirm('Excluir este trabalho e seus dados permanentemente deste navegador? Esta ação não pode ser desfeita.')){contentJobs=contentJobs.filter(x=>x.id!==b.dataset.deleteJob);if(activeJobId===b.dataset.deleteJob)activeJobId=null;write(KEYS.contentJobs,contentJobs);render();toast('Trabalho excluído deste navegador.')}}));document.querySelectorAll('[data-export-job]').forEach(b=>b.addEventListener('click',()=>exportJobPackage(b.dataset.exportJob)));document.querySelectorAll('[data-save-output]').forEach(b=>b.addEventListener('click',()=>{const j=contentJobs.find(x=>x.id===b.dataset.saveOutput);if(!j)return;j.output=$('jOutput').value;recordJobEvent(j,'Entrega salva',String(j.output||'').trim()?'Resultado atualizado; aguarda revisão conforme a etapa.':'Entrega salva vazia; nenhuma aprovação liberada.');write(KEYS.contentJobs,contentJobs);render();toast('Entrega salva no trabalho local.')}));document.querySelectorAll('[data-save-review]').forEach(b=>b.addEventListener('click',()=>{const j=contentJobs.find(x=>x.id===b.dataset.saveReview);if(!j)return;if(['Entregue','Cancelada'].includes(j.status)){toast('Este trabalho está encerrado; reabra um novo trabalho para continuar.');return}const status=$('jStatus').value,rights=$('jRights').checked,policy=$('jPolicy').checked,human=$('jHumanApproval').checked,hasOutput=Boolean(String(j.output||'').trim());if(['Em revisão','Aprovado','Entregue'].includes(status)&&!hasOutput){toast('Registre e salve uma entrega antes de enviar para revisão.');return}if(status==='Aprovado'&&!['Em revisão','Aprovado'].includes(j.status)){toast('Antes de aprovar, mova o trabalho para Em revisão e salve essa etapa.');return}if(status==='Aprovado'&&(!rights||!policy||!human)){toast('A aprovação exige direitos, regras da plataforma e autorização humana explícita.');return}if(status==='Entregue'&&j.status!=='Aprovado'){toast('A entrega só pode ser concluída depois da aprovação interna registrada.');return}if(status==='Entregue'&&(!rights||!policy||!human||!hasOutput)){toast('A entrega exige conteúdo, revisão completa e autorização humana.');return}const previous=j.status;j.rightsChecked=rights;j.policyChecked=policy;j.humanApproved=human;j.status=status;recordJobEvent(j,'Etapa alterada',previous+' → '+status+(status==='Aprovado'?' · aprovação humana registrada':'')+(status==='Entregue'?' · entrega local concluída; sem publicação externa':''));if(status==='Aprovado')j.approvedAt=j.updatedAt;if(status!=='Aprovado')j.approvedAt=null;if(j.requestId){const linked=requests.find(r=>r.id===j.requestId);if(linked){linked.status=status==='Entregue'?'Concluída':status==='Aprovado'?'Aprovada para entrega':status==='Em revisão'?'Aguardando revisão':status==='Em produção'?'Em execução na Dark Factory':'Encaminhada à Dark Factory';if(status==='Entregue')linked.completedAt=j.updatedAt;write(KEYS.requests,requests)}}write(KEYS.contentJobs,contentJobs);render();toast(status==='Entregue'?'Entrega local concluída; nada foi publicado externamente.':status==='Aprovado'?'Aprovação humana registrada. Publicação externa continua desativada.':'Etapa e histórico salvos localmente.')}));const cf=$('contentForm');if(cf)cf.addEventListener('submit',e=>{e.preventDefault();const title=$('cTitle').value.trim(),goal=$('cGoal').value.trim();if(!title||!goal)return;const job={id:'CT-'+Date.now().toString(36).toUpperCase(),title,mode:$('cMode').value,platform:$('cPlatform').value,goal,audience:$('cAudience').value.trim(),tone:$('cTone').value.trim(),brief:$('cBrief').value.trim(),output:'',status:'Briefing',rightsChecked:false,policyChecked:false,humanApproved:false,createdAt:new Date().toISOString()};recordJobEvent(job,'Criado','Trabalho criado diretamente na Dark Factory.');contentJobs.push(job);activeJobId=job.id;write(KEYS.contentJobs,contentJobs);render();toast('Trabalho criado. Abra a entrega para continuar.')});document.querySelectorAll('[data-done]').forEach(b=>b.addEventListener('click',()=>{const r=requests.find(x=>x.id===b.dataset.done);if(r){r.status='Concluída';r.completedAt=new Date().toISOString();write(KEYS.requests,requests);render();toast('Registro marcado como concluído localmente.')}}));document.querySelectorAll('[data-delete-note]').forEach(b=>b.addEventListener('click',()=>{if(confirm('Excluir esta nota?')){notes=notes.filter(n=>n.id!==b.dataset.deleteNote);write(KEYS.notes,notes);render()}}));
const bf=$('bizForm');if(bf)bf.addEventListener('submit',e=>{e.preventDefault();const kind=bf.dataset.kind,sets={catalog:{key:KEYS.catalog,rows:catalog},suppliers:{key:KEYS.suppliers,rows:suppliers},orders:{key:KEYS.orders,rows:orders},customers:{key:KEYS.customers,rows:customers}},set=sets[kind];if(!set)return;const record={id:'CM-'+Date.now().toString(36).toUpperCase(),createdAt:new Date().toISOString()};new FormData(bf).forEach((v,k)=>record[k]=String(v).trim());if(!Object.values(record).some((v,k)=>k!=='id'&&k!=='createdAt'&&String(v).trim()))return;set.rows.push(record);if(write(set.key,set.rows)){render();toast('Registro salvo neste navegador.')}});document.querySelectorAll('[data-delete-business]').forEach(b=>b.addEventListener('click',()=>{const sets={catalog:{key:KEYS.catalog,rows:catalog},suppliers:{key:KEYS.suppliers,rows:suppliers},orders:{key:KEYS.orders,rows:orders},customers:{key:KEYS.customers,rows:customers}},set=sets[b.dataset.deleteBusiness];if(!set)return;if(confirm('Excluir este registro local?')){set.rows.splice(0,set.rows.length,...set.rows.filter(x=>x.id!==b.dataset.id));if(write(set.key,set.rows))render()}}));const homeAsk=$('homeAskForm');if(homeAsk)homeAsk.addEventListener('submit',e=>{e.preventDefault();const prompt=$('homeIntent').value.trim();if(!prompt){$('homeIntent').focus();return}navigate('management');$('rTitle').value=prompt;$('rTitle').dispatchEvent(new Event('input',{bubbles:true}));$('rDetail').focus()});
const rfTitle=$('rTitle'),rfDetail=$('rDetail'),worldQuestions=$('worldQuestions');
function classifyRequestIntent(value){
 const t=String(value||'').toLocaleLowerCase('pt-BR');
 if(/vídeo|video|short|reel|roteiro|legenda|dubl|áudio|audio|imagem|conteúdo|conteudo|thumbnail|edição|edicao/.test(t))return {kind:'Produção',area:/canal|public|youtube|instagram|tiktok/.test(t)?'Terra / Gestão de canais':'Céu / Dark Factory',label:'Conteúdo e produção',first:'Qual formato e destino devemos considerar?',firstChips:['YouTube · vídeo longo','Shorts / Reels','Roteiro e legenda','Quero recomendação'],second:'Qual é o principal resultado desse conteúdo?',secondChips:['Apresentar uma ideia','Ensinar algo','Entreter a audiência','Divulgar produto ou projeto'],third:'Que público, idioma ou material de referência já existe?',thirdChips:['Público iniciante','Público que já conhece o tema','Tenho material de referência','Preciso começar do zero']};
 if(/marca|marketing|público|publico|tendência|tendencia|campanha|identidade|divulgação|divulgacao|anúncio|anuncio/.test(t))return {kind:'Pesquisa',area:'Céu / Marketing',label:'Marketing e comunicação',first:'Qual objetivo de comunicação importa mais?',firstChips:['Atrair audiência','Apresentar uma marca','Vender um produto','Pesquisar tendências'],second:'Quem você quer alcançar?',secondChips:['Público geral','Um nicho específico','Clientes existentes','Ainda preciso descobrir'],third:'Há uma marca, campanha ou referência que devemos respeitar?',thirdChips:['Já tenho identidade e referências','Preciso criar a identidade','Quero comparar opções','Ainda não tenho material']};
 if(/produto|loja|fornecedor|cliente|pedido|venda|comercial|ecommerce|e-commerce/.test(t))return {kind:'Operação',area:'Terra / Comercial',label:'Operação comercial',first:'Em qual parte do negócio precisamos atuar primeiro?',firstChips:['Pesquisar fornecedores','Organizar produtos','Planejar uma venda','Automatizar pedidos'],second:'Qual resultado concreto você espera?',secondChips:['Lista de opções','Catálogo organizado','Processo de venda','Fluxo de automação'],third:'Já existem produtos, fornecedores ou regras que precisam ser usados?',thirdChips:['Já tenho dados','Preciso pesquisar opções','Tenho um processo para corrigir','Ainda estou definindo']};
 if(/conexão|conectar|api|integração|plataforma|conta externa|oauth|sincron/.test(t))return {kind:'Operação',area:'WordDark / Auditoria',label:'Conexão e integração',first:'Qual sistema precisa se conectar e em qual direção os dados devem circular?',firstChips:['Receber informações','Enviar uma publicação','Sincronizar arquivos','Mapear possibilidades primeiro'],second:'Qual capacidade precisa funcionar primeiro?',secondChips:['Autenticar com segurança','Ler dados','Enviar dados','Testar sem operar de verdade'],third:'Há documentação, conta de teste e permissões disponíveis?',thirdChips:['Tenho documentação','Tenho conta de teste','Preciso configurar permissões','Ainda não sei']};
 if(/erro|falha|corrigir|quebrou|bug|não funciona|nao funciona/.test(t))return {kind:'Correção',area:'WordDark / Auditoria',label:'Diagnóstico e correção',first:'Qual comportamento está falhando?',firstChips:['Não abre','Não salva corretamente','Uma operação falha','Aparece uma mensagem de erro'],second:'O que deveria acontecer no lugar?',secondChips:['Abrir uma tela','Salvar os dados','Completar uma operação','Outro resultado'],third:'Você tem mensagem de erro, passos para reproduzir ou um exemplo?',thirdChips:['Tenho mensagem de erro','Consigo reproduzir','Tenho uma captura ou exemplo','Preciso investigar primeiro']};
 if(/custo|dinheiro|finance|pagamento|receita|despesa|orçamento|orcamento|assinatura/.test(t))return {kind:'Financeira',area:'WordDark / Auditoria',label:'Financeiro e planejamento',first:'O que você precisa fazer com os valores?',firstChips:['Registrar movimento','Calcular custos','Planejar orçamento','Auditar um registro'],second:'Qual período ou decisão está envolvido?',secondChips:['Uma operação pontual','Este mês','Um plano recorrente','Ainda preciso definir'],third:'Já tem valores e comprovantes, ou precisa preparar uma estimativa?',thirdChips:['Tenho valores registrados','Tenho comprovantes','Preciso estimar','Ainda vou reunir os dados']};
 return {kind:'Pesquisa',area:'WordDark / Auditoria',label:'Solicitação geral',first:'Qual resultado você quer alcançar?',firstChips:['Criar algo novo','Melhorar algo existente','Descobrir como funciona','Resolver um problema'],second:'Como você vai reconhecer que a tarefa deu certo?',secondChips:['Receber algo pronto','Ter um plano claro','Entender as opções','Corrigir uma falha'],third:'Que contexto, material ou limite pode mudar a solução?',thirdChips:['Tenho referências','Há um prazo importante','Existem limites que devemos respeitar','Quero ajuda para descobrir']};
}
function updateWorldQuestions(){
 if(!worldQuestions||!rfTitle)return;
 const title=rfTitle.value.trim(),detail=rfDetail?rfDetail.value.trim():'';
 if(!title){worldQuestions.dataset.stage='0';worldQuestions.innerHTML='<strong>Vamos entender a necessidade.</strong><p>Conte o que você quer resolver. Vou fazer uma pergunta por vez e sugerir a área responsável.</p>';return}
 const profile=classifyRequestIntent(title);
 const stage=Math.max(0,Math.min(4,Number(worldQuestions.dataset.stage||0)));
 if(stage===0){if($('rArea'))$('rArea').value=profile.area;if($('rKind'))$('rKind').value=profile.kind}
 let heading='',question='',chips=[];
 if(stage===0){heading='1 · Entender o pedido';question=profile.first;chips=profile.firstChips}
 else if(stage===1){heading='2 · Definir o resultado';question=profile.second;chips=profile.secondChips}
 else if(stage===2){heading='3 · Reunir o contexto';question=profile.third;chips=profile.thirdChips}
 else if(stage===3){heading='4 · Conferir os limites';question='Há prazo, autorização, direitos de uso ou alguma condição que não podemos ultrapassar?';chips=['Sem prazo definido','Tenho um prazo','Precisa de revisão antes de usar','Há limites importantes']}
 else {heading='Direção inicial organizada';question='Área sugerida: '+profile.area+'. Tipo sugerido: '+profile.kind+'. Confira as informações abaixo e registre quando estiver pronto.';chips=[]}
 worldQuestions.innerHTML='<strong>'+esc(heading)+'</strong><p>'+esc(question)+(detail?' <span class="question-context">Contexto reunido: '+esc(detail.length>180?detail.slice(0,177)+'…':detail)+'</span>':'')+'</p>'+(chips.length?'<div class="question-chips">'+chips.map(c=>'<button type="button" data-answer="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+'<div class="question-actions">'+(stage>0?'<button type="button" class="btn" data-question-back>← Pergunta anterior</button>':'')+(stage<4?'<button type="button" class="btn" data-question-next>Próxima pergunta →</button>':'<button type="button" class="btn gold" data-request-ready>Registrar solicitação ↗</button>')+'</div>';
 worldQuestions.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(rfDetail){const current=rfDetail.value.trim();rfDetail.value=current?(current+'\n'+b.dataset.answer):b.dataset.answer}worldQuestions.dataset.stage=String(Math.min(4,stage+1));updateWorldQuestions();if(rfDetail)rfDetail.focus()}));
 const back=worldQuestions.querySelector('[data-question-back]');if(back)back.addEventListener('click',()=>{worldQuestions.dataset.stage=String(Math.max(0,stage-1));updateWorldQuestions()});
 const next=worldQuestions.querySelector('[data-question-next]');if(next)next.addEventListener('click',()=>{worldQuestions.dataset.stage=String(Math.min(4,stage+1));updateWorldQuestions()});
 const ready=worldQuestions.querySelector('[data-request-ready]');if(ready&&$('requestForm'))ready.addEventListener('click',()=>{$('requestForm').requestSubmit()});
}
if(rfTitle)rfTitle.addEventListener('input',()=>{if(worldQuestions)worldQuestions.dataset.stage='0';updateWorldQuestions()});
if(rfDetail)rfDetail.addEventListener('input',updateWorldQuestions);
updateWorldQuestions();
const rf=$('requestForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();const title=$('rTitle').value.trim();if(!title)return;const profile=classifyRequestIntent(title);const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,kind:$('rKind').value||profile.kind,area:$('rArea').value||profile.area,date:$('rDate').value,detail:$('rDetail').value.trim(),status:'Aberta',clarificationStage:Number(worldQuestions?.dataset.stage||0),suggestedArea:profile.area,suggestedKind:profile.kind,createdAt:new Date().toISOString()};requests.push(item);if(!write(KEYS.requests,requests))return;render();toast('Solicitação registrada localmente. A sugestão de área ficou salva para conferência.')});
const lf=$('ledgerForm');if(lf)lf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('lAmount').value),desc=$('lDesc').value.trim();if(!desc||!Number.isFinite(amount)||amount<=0)return;ledger.push({id:String(Date.now()),desc,amount,type:$('lType').value,createdAt:new Date().toISOString()});write(KEYS.ledger,ledger);render();toast('Lançamento adicionado ao Cofre do mundo.')});
const tf=$('transferForm');if(tf)tf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('tAmount').value),reason=$('tReason').value.trim();if(!reason||!Number.isFinite(amount)||amount<=0)return;transfers.push({id:String(Date.now()),amount,reason,status:'Aguardando decisão',createdAt:new Date().toISOString()});write(KEYS.transfers,transfers);render();toast('Proposta criada; nenhum dinheiro foi transferido.')});
const nf=$('noteForm');if(nf)nf.addEventListener('submit',e=>{e.preventDefault();const title=$('nTitle').value.trim(),body=$('nBody').value.trim();if(!title||!body)return;notes.push({id:String(Date.now()),title,body,createdAt:new Date().toISOString()});write(KEYS.notes,notes);render();toast('Nota guardada na biblioteca local.')})}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
