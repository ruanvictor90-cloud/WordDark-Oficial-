/* World refresh: atmospheric backgrounds, quieter surfaces, app-launcher navigation */
:root{--bg:#080d18;--surface:rgba(12,18,31,.78);--surface2:rgba(24,32,52,.76);--line:rgba(185,203,244,.19);--text:#f3f6ff;--muted:#b2bdd2;--gold:#c7d6ff;--green:#8fddc3;--red:#f0a4ad;--blue:#a8c8ff}
html{background:#080d18}
body{position:relative;isolation:isolate;background:#080d18;color:var(--text)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(ellipse at 50% -20%,rgba(36,37,42,.98),rgba(9,10,13,1) 58%);background-position:center;background-size:cover;background-repeat:no-repeat;opacity:1}
body[data-page="sky"]::before{background-image:radial-gradient(ellipse at 55% 0%,rgba(38,43,54,.95),rgba(9,10,13,1) 62%)}
body[data-page="earth"]::before{background-image:radial-gradient(ellipse at 45% 0%,rgba(42,39,31,.8),rgba(9,10,13,1) 62%)}
.layout{grid-template-columns:minmax(0,1fr)}
.side{display:none!important}
.main{min-height:100vh;background:transparent}
.topbar{position:sticky;top:0;z-index:6;background:rgba(7,11,20,.76);border-bottom-color:rgba(185,203,244,.16);backdrop-filter:blur(18px)}
.content{max-width:1120px;padding-top:26px}
.card,.form-card,.principle,.stat{background:linear-gradient(145deg,rgba(18,27,45,.78),rgba(10,16,28,.72));border-color:rgba(190,208,248,.18);box-shadow:0 12px 34px rgba(0,0,0,.1);backdrop-filter:blur(12px)}
.module{min-height:138px;border-radius:19px;transition:transform .16s,border-color .16s,background .16s}
.module:hover{transform:translateY(-2px);border-color:rgba(190,214,255,.48);background:linear-gradient(145deg,rgba(33,47,75,.88),rgba(12,19,34,.82))}
.module-icon{background:rgba(157,184,239,.12);border-color:rgba(183,207,255,.25);color:#d0ddff}
.nav button.active,.mobile-nav button.active{background:rgba(134,163,220,.18);border-color:rgba(182,205,255,.3);color:#f2f6ff}
.btn.gold{background:linear-gradient(135deg,#d4e2ff,#9db9f0);border-color:#b4cbfb;color:#101a2c}
.btn{border-color:rgba(185,203,244,.2);background:rgba(26,36,57,.82)}
.field input,.field textarea,.field select{background:rgba(6,11,21,.72);border-color:rgba(185,203,244,.23);color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#9fbbf4;outline:2px solid rgba(159,187,244,.18)}
.notice{background:rgba(37,38,47,.72);border-color:rgba(207,194,154,.25);color:#e4e0d5}
.mobile-nav{background:rgba(6,10,19,.86);border-top-color:rgba(185,203,244,.18);backdrop-filter:blur(18px)}
.world-hero{position:relative;overflow:hidden;border:1px solid rgba(190,208,248,.22);border-radius:26px;padding:clamp(22px,4vw,42px);margin-bottom:26px;background:linear-gradient(120deg,rgba(9,16,31,.8),rgba(24,30,57,.62));box-shadow:0 20px 50px rgba(0,0,0,.16);backdrop-filter:blur(14px)}
.world-hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid rgba(184,205,255,.18);border-radius:50%;right:-90px;top:-120px;box-shadow:0 0 0 28px rgba(184,205,255,.025),0 0 0 60px rgba(184,205,255,.02);pointer-events:none}
.world-hero h1{font-size:clamp(30px,5vw,48px);max-width:760px;margin:12px 0}
.world-hero>p{color:#c0cbe0;max-width:650px;line-height:1.65}
.home-ask{position:relative;z-index:1;max-width:840px;margin-top:22px;padding:10px;border:1px solid rgba(196,214,255,.24);border-radius:18px;background:rgba(5,10,20,.55)}
.home-ask textarea{width:100%;min-height:76px;resize:vertical;border:0;outline:0;background:transparent;color:var(--text);padding:10px;font:inherit}
.home-ask textarea::placeholder{color:#9daac4}
.home-ask-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 4px 3px 10px;color:#aebbd3;font-size:11px}
.hero-hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero-hints span{border:1px solid rgba(190,208,248,.2);border-radius:99px;padding:5px 9px;color:#c8d4ec;background:rgba(8,14,27,.35);font-size:10px}
.world-app-grid .module{min-height:150px}
.request-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(230px,.7fr);gap:14px;align-items:start}
.request-composer{padding:clamp(16px,3vw,25px)}
.composer-label{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.composer-label h3{margin:0 0 4px;font-size:14px}
.composer-label p,.advanced-settings p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
.composer-orb,.side-symbol{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border:1px solid rgba(190,208,248,.28);border-radius:15px;background:rgba(146,174,232,.14);font-size:22px;color:#dce7ff}
.world-questions{margin:14px 0;padding:15px;border:1px solid rgba(190,208,248,.22);border-radius:15px;background:rgba(117,145,204,.09)}
.world-questions strong{font-size:12px;color:#e3ebff}
.world-questions p{font-size:12px;color:#bac7df;line-height:1.55;margin:6px 0 0}
.question-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.question-chips button{border:1px solid rgba(190,208,248,.24);border-radius:99px;background:rgba(132,159,213,.1);padding:7px 10px;color:#e0e9ff;font-size:11px}
.question-chips button:hover{background:rgba(132,159,213,.2)}
.advanced-settings{border-top:1px solid rgba(190,208,248,.16);padding-top:13px;margin-top:12px}
.advanced-settings summary{cursor:pointer;color:#c9d6ef;font-size:11px;padding:5px 0 12px}
.advanced-settings p{margin-bottom:12px}
.submit-request{width:100%;min-height:47px;margin-top:8px}
.request-side{display:grid;gap:12px}
.request-side .card{margin:0}
.question-card p{font-size:11px;color:#bbc7dc;line-height:1.65}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:700px){.request-layout{grid-template-columns:1fr}.request-side{grid-template-columns:1fr}.world-hero{padding:23px 17px}.home-ask-foot{align-items:flex-start;flex-direction:column;padding:7px}.home-ask-foot .btn{width:100%}.content{padding:17px 13px 95px}.world-app-grid .module{min-height:125px}.top-actions .optional{display:none}}

/* Ruan interface foundation: quiet charcoal surfaces and warm, restrained accents. Original scene artwork will be added only when the correct references are available. */
:root{--bg:#090a0d;--surface:rgba(18,20,25,.94);--surface2:rgba(26,27,32,.96);--line:#292d35;--text:#f2f3f5;--muted:#a0a5af;--gold:#c5a36c;--green:#7da68a;--red:#d69a9a;--blue:#a6b6d0}
html,body{background:#090a0d;color:var(--text)}
body::before{background-image:radial-gradient(ellipse at 50% -20%,rgba(36,37,42,.98),rgba(9,10,13,1) 58%);background-position:center top;background-size:cover;opacity:1}
body[data-page="sky"]::before{background-image:radial-gradient(ellipse at 55% 0%,rgba(38,43,54,.95),rgba(9,10,13,1) 62%)}
body[data-page="earth"]::before{background-image:radial-gradient(ellipse at 45% 0%,rgba(42,39,31,.8),rgba(9,10,13,1) 62%)}
.topbar{background:rgba(12,13,17,.88);border-bottom-color:var(--line)}
.world-hero{background:linear-gradient(130deg,rgba(26,27,32,.97),rgba(17,18,22,.98) 68%,rgba(28,24,17,.95));border-color:#303039;box-shadow:none;backdrop-filter:blur(8px)}
.world-hero:after{content:"◈";width:auto;height:auto;border:0;border-radius:0;right:14px;top:auto;bottom:-50px;font-size:180px;line-height:1;font-weight:900;color:rgba(255,255,255,.025);box-shadow:none}
.world-hero h1{letter-spacing:-.045em}
.world-hero>p{color:#aeb2bb}
.card,.form-card,.principle,.stat{background:linear-gradient(145deg,rgba(23,25,31,.97),rgba(16,17,21,.98));border-color:var(--line);box-shadow:none;backdrop-filter:none}
.module{border-radius:20px;min-height:137px}
.module:hover{border-color:#55515a;background:linear-gradient(145deg,#202229,#111216);transform:translateY(-1px)}
.module-icon{background:#202229;border-color:#373941;color:var(--gold)}
.btn{border-color:var(--line);background:#202229}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#15120c}
.nav button.active,.mobile-nav button.active{background:#201e19;border-color:#443a29;color:#f1dfbf}
.field input,.field textarea,.field select{background:rgba(11,12,16,.96);border-color:#30343d;color:var(--text)}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold);outline:2px solid rgba(197,163,108,.18)}
.mobile-nav{background:rgba(11,12,16,.96);border-top-color:var(--line);backdrop-filter:blur(14px)}
.notice{background:#1b1813;border-color:#39332a;color:#c5b99f}
.pill.ready{color:var(--green);border-color:#31493a}
@media(max-width:850px){.world-hero{border-radius:24px;padding:23px 21px}.content{padding-top:20px}}

/* Guided request flow: one question at a time, with explicit routing suggestions. */
.world-questions{border:1px solid #37332a;background:linear-gradient(145deg,rgba(30,28,24,.92),rgba(17,18,21,.97));border-radius:16px;padding:16px;margin:14px 0;color:var(--text)}
.world-questions>strong{display:block;color:#e4c997;font-size:.78rem;letter-spacing:.045em;text-transform:uppercase}
.world-questions>p{margin:8px 0 12px;color:#d0d2d7;line-height:1.55}
.question-context{display:block;margin-top:8px;color:#a9adb6;font-size:.86rem;overflow-wrap:anywhere}
.question-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.question-chips{display:flex;flex-wrap:wrap;gap:8px}
.question-chips button{border:1px solid #424047;border-radius:999px;padding:9px 12px;background:#202126;color:#f0eee8;font:inherit;font-size:.88rem;cursor:pointer}
.question-chips button:hover{border-color:#b59a6b;background:#2a261f}
@media(max-width:600px){.question-actions .btn{flex:1}}

.capture-hero{position:relative;overflow:hidden;border:1px solid #433a2b;border-radius:22px;padding:24px;background:radial-gradient(ellipse at 90% 0%,#3a3020 0,transparent 45%),linear-gradient(135deg,#1c1a17,#111318 70%);margin:16px 0 22px}.capture-hero h2{font-size:clamp(24px,4vw,38px);line-height:1.08;max-width:650px;margin:8px 0}.capture-hero p{color:#b8b5ae;max-width:650px;margin:8px 0 16px}.capture-eyebrow{color:var(--gold);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.capture-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;max-width:760px}.capture-search input,.capture-form input,.capture-form textarea,.capture-form select,.capture-filters select{width:100%;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#0c0d11;color:var(--text)}.capture-categories{display:flex;gap:8px;overflow-x:auto;padding:3px 0 10px;margin:8px 0 18px}.capture-categories button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:8px 13px;background:#15171c;color:#c5c9d0;font-size:11px}.capture-categories button.active{background:#c5a36c;color:#15120d;border-color:#c5a36c;font-weight:700}.capture-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 22px}.capture-filters label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.capture-filters select{width:auto;max-width:210px;padding:8px 10px}.capture-rail{margin:20px 0 25px}.capture-rail-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:11px}.capture-rail-head h2{font-size:17px;margin:0}.capture-rail-head span{font-size:10px;color:var(--muted)}.capture-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.capture-tile{min-width:0;border:1px solid var(--line);border-radius:15px;background:linear-gradient(160deg,#171a20,#101115);padding:15px;display:flex;flex-direction:column;gap:8px}.capture-tile-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.capture-tile h3{font-size:14px;line-height:1.3;margin:2px 0;overflow-wrap:anywhere}.capture-tile .capture-description{font-size:11px;color:#a6acb7;line-height:1.45;overflow-wrap:anywhere}.capture-tile .capture-value{font-size:20px;font-weight:750;color:#f0dfbd}.capture-tile .capture-meta{font-size:10px;color:var(--muted)}.capture-tile .capture-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}.capture-form{border:1px solid #393d46;background:#111318;border-radius:17px;padding:17px;margin:14px 0}.capture-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.capture-field{display:grid;gap:5px;min-width:0}.capture-field label{font-size:10px;color:#a9afba}.capture-field.full{grid-column:1/-1}.capture-form textarea{min-height:80px;resize:vertical}.capture-form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.capture-empty{border:1px dashed #343944;border-radius:14px;padding:20px;color:var(--muted);font-size:12px}
@media(max-width:700px){.capture-hero{padding:18px}.capture-cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.capture-tile{padding:12px}.capture-tile .capture-value{font-size:17px}.capture-form-grid{grid-template-columns:1fr}.capture-field.full{grid-column:auto}.capture-search{grid-template-columns:1fr}.capture-filters select{max-width:170px}}
@media(max-width:430px){.capture-cards{grid-template-columns:1fr}.capture-tile{padding:14px}.capture-tile h3{font-size:15px}}

</nav><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const KEYS={requests:'worddark.ecosystem.requests.v1',ledger:'worddark.ecosystem.ledger.v1',transfers:'worddark.ecosystem.transfers.v1',notes:'worddark.ecosystem.notes.v1',tasks:'worddark.ecosystem.tasks.v1',contentJobs:'worddark.v1.content-jobs.v1',launchChecklist:'worddark.launch.checklist.v1',executorProfiles:'worddark.executors.profiles.v1',executorPublications:'worddark.executors.publications.v1',catalog:'worddark.commerce.catalog.v1',suppliers:'worddark.commerce.suppliers.v1',orders:'worddark.commerce.orders.v1',customers:'worddark.commerce.customers.v1',captureInbox:'worddark.capture.inbox.v1'};
const read=k=>{try{const x=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(x)?x:[]}catch{return []}};
const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Não foi possível salvar neste navegador.');return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'}):'Sem data';
let requests=read(KEYS.requests),ledger=read(KEYS.ledger),transfers=read(KEYS.transfers),notes=read(KEYS.notes),tasks=read(KEYS.tasks),contentJobs=read(KEYS.contentJobs),launchChecklist=read(KEYS.launchChecklist),executorProfiles=read(KEYS.executorProfiles),executorPublications=read(KEYS.executorPublications),catalog=read(KEYS.catalog),suppliers=read(KEYS.suppliers),orders=read(KEYS.orders),customers=read(KEYS.customers),page=new URLSearchParams(location.search).get('view')||'overview';if(!executorProfiles.length){executorProfiles=[{id:'sucocast',name:'SucoCast',purpose:'Podcast, conversas e ideias',status:'Planejamento',platform:'A definir'},{id:'sucogeek',name:'SucoGeek',purpose:'Cultura geek, jogos e entretenimento',status:'Planejamento',platform:'A definir'},{id:'sucocomed',name:'SucoComed',purpose:'Humor, comédia e formatos curtos',status:'Planejamento',platform:'A definir'},{id:'sucoempreendimento',name:'SucoEmpreendimento',purpose:'Negócios, produtos e empreendedorismo',status:'Planejamento',platform:'A definir'}];write(KEYS.executorProfiles,executorProfiles)}
const names={overview:'Visão geral',launch:'Lançamento sem custo',executors:'Contas executoras',management:'Gerenciamento',sky:'Céu',earth:'Terra',finance:'Financeira',library:'Biblioteca',security:'Segurança',channels:'Gestão de canais',workbench:'Bancada de conteúdo',marketing:'Marketing',commerce:'Empresa comercial',catalog:'Catálogo de produtos',suppliers:'Fornecedores',orders:'Pedidos',customers:'Clientes',costs:'Custos e margem',commercialRules:'Regras comerciais',capture:'Central de Captação'};
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
const WORLD_NOTIFICATIONS_KEY='ruan.world.notifications.v1';function pushRuanNotification(title,message,kind='info'){try{const list=JSON.parse(localStorage.getItem(WORLD_NOTIFICATIONS_KEY)||'[]');const next=Array.isArray(list)?list:[];next.push({id:'wd-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),title:String(title||'Aviso do WordDark').slice(0,120),message:String(message||'').slice(0,500),kind,source:'WordDark',createdAt:new Date().toISOString(),read:false});localStorage.setItem(WORLD_NOTIFICATIONS_KEY,JSON.stringify(next.slice(-100)))}catch{}}
function persist(){write(KEYS.requests,requests);write(KEYS.ledger,ledger);write(KEYS.transfers,transfers);write(KEYS.notes,notes);write(KEYS.tasks,tasks);write(KEYS.contentJobs,contentJobs)}
const BACKUP_COLLECTIONS={requests:KEYS.requests,ledger:KEYS.ledger,transfers:KEYS.transfers,notes:KEYS.notes,tasks:KEYS.tasks,contentJobs:KEYS.contentJobs,launchChecklist:KEYS.launchChecklist,executorProfiles:KEYS.executorProfiles,executorPublications:KEYS.executorPublications,catalog:KEYS.catalog,suppliers:KEYS.suppliers,orders:KEYS.orders,customers:KEYS.customers,captureInbox:KEYS.captureInbox};
function exportWorldBackup(){const collections={};for(const [name,key] of Object.entries(BACKUP_COLLECTIONS)){try{const value=JSON.parse(localStorage.getItem(key)||'[]');collections[name]=Array.isArray(value)?value:[]}catch{toast('Não foi possível ler a coleção '+name+'. Backup cancelado.');return}}const payload={app:'WordDark',formatVersion:1,exportedAt:new Date().toISOString(),collections};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='worddark-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup local exportado. Guarde o arquivo em segurança.')}
async function restoreWorldBackupFile(file){if(!file)return;if(file.size>5*1024*1024){toast('Arquivo acima de 5 MB. Restauração recusada.');return}let payload;try{payload=JSON.parse(await file.text())}catch{toast('Arquivo inválido: não é um JSON legível.');return}if(!payload||payload.app!=='WordDark'||payload.formatVersion!==1||!payload.collections||typeof payload.collections!=='object'){toast('Backup incompatível. Nenhum dado foi alterado.');return}for(const name of Object.keys(BACKUP_COLLECTIONS)){if(!Array.isArray(payload.collections[name])){if(name==='captureInbox'&&payload.collections[name]===undefined){payload.collections[name]=[]}else{toast('Backup incompleto ou inválido: '+name+'. Nenhum dado foi alterado.');return}}}if(!confirm('Restaurar este backup WordDark? Isso substituirá as coleções locais atuais neste navegador. Exporte um backup atual antes se quiser preservá-lo.'))return;const previous={};try{for(const [name,key] of Object.entries(BACKUP_COLLECTIONS)){previous[key]=localStorage.getItem(key);localStorage.setItem(key,JSON.stringify(payload.collections[name]))}}catch{for(const [key,value] of Object.entries(previous)){try{if(value===null)localStorage.removeItem(key);else localStorage.setItem(key,value)}catch{}}toast('Falha ao restaurar. Foi tentada a recuperação dos dados anteriores.');return}toast('Backup restaurado. Recarregando os dados locais.');location.reload()}
function navigate(p){page=p in names?p:'overview';document.body.dataset.page=page;$('crumbName').textContent=names[page];document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>navigate(b.dataset.page)));
$('backRuan').addEventListener('click',()=>location.href='../../ruan/index.html');
$('newRequestTop').addEventListener('click',()=>navigate('management'));
$('worldHomeBtn')?.addEventListener('click',()=>navigate('overview'));
function head(kicker,title,sub,button=''){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div>'+button+'</div>'}
function stat(label,value,note,klass=''){return '<div class="card"><div class="stat-label">'+label+'</div><div class="stat-value '+klass+'">'+value+'</div><div class="stat-note">'+note+'</div></div>'}
function module(p,icon,title,desc,status='Disponível',cls='ready'){return '<button class="card module" data-go="'+p+'"><span class="module-icon">'+icon+'</span><h3>'+title+'</h3><p>'+desc+'</p><span class="status '+(cls==='pending'?'pending':'')+'">'+status+' →</span></button>'}
function empty(t){return '<div class="empty">'+t+'</div>'}
function reqList(limit=99){const arr=requests.slice().reverse().slice(0,limit);if(!arr.length)return empty('Nenhuma intenção registrada. Crie uma solicitação para iniciar um fluxo.');return '<div class="list">'+arr.map(r=>{const terminal=['Concluída','Cancelada'].includes(r.status),area=String(r.suggestedArea||r.area||''),factory=(r.kind==='Produção'||area.includes('Dark Factory'))&&!area.includes('Marketing'),routeButton=factory?(r.linkedJobId?'<button class="btn" data-route-request="'+esc(r.id)+'">Abrir trabalho</button>':'<button class="btn gold" data-dispatch-request="'+esc(r.id)+'">Enviar à Dark Factory</button>'):'<button class="btn gold" data-route-request="'+esc(r.id)+'">Abrir setor sugerido</button>';return '<div class="item"><div class="module-icon">↳</div><div class="item-main"><div class="item-title">'+esc(r.title)+'</div><div class="item-meta">'+esc(r.kind)+' · '+esc(r.area)+' · '+date(r.date)+' · '+esc(r.detail||'Sem detalhes')+(r.routedTo?' · Setor aberto: '+esc(r.routedTo):'')+'</div></div><span class="pill '+(r.status==='Concluída'?'ready':r.status==='Cancelada'?'off':'pending')+'">'+esc(r.status)+'</span><div style="display:flex;flex-wrap:wrap;gap:6px">'+routeButton+'<button class="btn" data-done="'+esc(r.id)+'" '+(terminal?'disabled':'')+'>Concluir</button><button class="btn" data-cancel-request="'+esc(r.id)+'" '+(terminal?'disabled':'')+'>Cancelar</button><button class="btn" data-delete-request="'+esc(r.id)+'">Excluir</button></div></div>'}).join('')+'</div>'}
function overview(){const pending=requests.filter(r=>!['Concluída','Cancelada'].includes(r.status)).length;return '<section class="world-hero"><div class="eyebrow">CENTRAL DO MUNDO · USUÁRIO ÚNICO</div><h1>O que vamos resolver hoje?</h1><p>Você pode trazer uma ordem, uma ideia incompleta ou simplesmente contar o que está acontecendo. O mundo ajuda a descobrir o próximo passo.</p><form id="homeAskForm" class="home-ask"><label class="sr-only" for="homeIntent">Conte o que você precisa</label><textarea id="homeIntent" maxlength="1200" placeholder="Ex.: Quero preparar um vídeo, mas ainda não sei qual formato funciona melhor…"></textarea><div class="home-ask-foot"><span>O WordDark fará perguntas quando faltar informação.</span><button class="btn gold" type="submit">Começar solicitação ↗</button></div></form><div class="hero-hints"><span>✦ Ideia</span><span>⌁ Pesquisa</span><span>▧ Produção</span><span>⚙ Operação</span></div></section><div class="section-head"><h2>Escolha uma área</h2><span>Os detalhes ficam dentro de cada setor</span></div><div class="grid three world-app-grid">'+module('management','⌘','Central de Operações','Solicitações, perguntas e acompanhamento.')+module('sky','✧','Céu','Marketing, produção e soluções.')+module('earth','◉','Terra','Empresas, canais e necessidades.')+module('finance','◫','Financeira','Registros financeiros do mundo.')+module('library','▤','Biblioteca','Memória, arquivos e decisões locais.')+module('security','⛨','Segurança','Autoridade, limites e estado técnico.')+module('capabilities','◈','Capacidades','Veja o que está disponível, parcial ou ainda desconectado.')+module('launch','🚀','Lançamento sem custo','Plano prático para começar com trabalho manual e sem API paga.','Começar','ready')+module('automation','⚙','Central de automação','Preparação local de pacotes e fila de execução.','Ativo','ready')+'</div><div class="section-head"><h2>Em andamento</h2><span>'+pending+' solicitações abertas</span></div>'+reqList(3)}


function launchDesk(){const steps=[{id:'account',title:'Conferir a conta oficial',detail:'Verifique nome, foto, banner, descrição e links do WordDark Oficial na plataforma escolhida.'},{id:'mission',title:'Criar a missão de estreia',detail:'Na Dark Factory, gere o pacote de apresentação. Se já existir, abra o trabalho existente em vez de duplicar.'},{id:'prepare',title:'Preparar o pacote local',detail:'Use a Central de automação para criar rascunhos de título, descrição, CTA e hashtags.'},{id:'review',title:'Revisar conteúdo e direitos',detail:'Leia tudo, confirme fatos, músicas, imagens, licenças e regras da plataforma. Não publique material duvidoso.'},{id:'export',title:'Exportar o pacote de trabalho',detail:'Baixe o pacote da Dark Factory para copiar o conteúdo manualmente sem depender de integração.'},{id:'publish',title:'Publicar manualmente',detail:'Entre diretamente na plataforma oficial e publique somente depois da revisão humana. O WordDark não publica por conta própria.'},{id:'proof',title:'Guardar evidência e resultado',detail:'Registre o link público, a data, o que funcionou e o que precisa melhorar numa nota da Biblioteca.'},{id:'backup',title:'Fazer backup local',detail:'Exporte o backup completo na Biblioteca e guarde-o fora do navegador. Ele não sincroniza dispositivos.'}];const done=new Set(launchChecklist);const count=steps.filter(s=>done.has(s.id)).length;return head('Plano de arranque · investimento zero','Colocar o WordDark em movimento','Comece pequeno: uma conta oficial, um conteúdo revisado, publicação manual e registro do resultado. Sem chave de API, sem hospedagem adicional e sem prometer automações que ainda não existem.')+'<div class="grid stats">'+stat('Investimento inicial','R$ 0','Usando ferramentas e contas que já existem')+stat('Etapas concluídas',count+' / '+steps.length,'Checklist salvo neste navegador',count===steps.length?'green-text':'')+stat('Publicação','Manual','A pessoa responsável confirma tudo')+stat('Integrações externas','0 ativas','Não são requisito para o primeiro teste')+'</div><div class="notice" style="margin-top:14px"><strong>Regra de arranque:</strong> o WordDark organiza e prepara; você executa manualmente as ações externas. Não coloque senhas nem chaves secretas na interface. Os registros deste protótipo ficam no navegador e não são sincronizados.</div><div class="section-head"><h2>Rota mínima de lançamento</h2><span>'+Math.round(count/steps.length*100)+'% concluído</span></div><div class="list">'+steps.map((s,i)=>'<label class="item" style="cursor:pointer"><input type="checkbox" data-launch-check="'+s.id+'" '+(done.has(s.id)?'checked':'')+' style="width:18px;height:18px;accent-color:var(--gold);margin-top:3px"><div class="item-main"><div class="item-title">'+(i+1)+'. '+esc(s.title)+'</div><div class="item-meta">'+esc(s.detail)+'</div></div><span class="pill '+(done.has(s.id)?'ready':'pending')+'">'+(done.has(s.id)?'Feito':'Pendente')+'</span></label>').join('')+'</div><div class="section-head"><h2>Ações diretas</h2><span>Sem conexão paga</span></div><div class="grid two">'+module('workbench','▧','Abrir Dark Factory','Criar ou revisar o pacote de estreia e exportar o trabalho.')+module('automation','⚙','Preparação local','Gerar uma base de conteúdo usando regras locais, sempre revisando antes de usar.')+module('library','▤','Biblioteca e backup','Guardar aprendizados e exportar seus dados locais.')+module('capabilities','◈','Conferir capacidades','Ver claramente o que já funciona e o que ainda depende de integração.')+'</div><div class="card" style="margin-top:14px"><h3>COMO SABER SE O PRIMEIRO CICLO FUNCIONOU?</h3><p class="sub">Só considere o ciclo concluído quando existir: (1) um pacote exportado, (2) revisão humana documentada, (3) publicação real feita diretamente na plataforma, se você decidir publicar, e (4) registro do resultado na Biblioteca. Marcar uma caixa aqui é apenas acompanhamento local; não confirma ações externas automaticamente.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn gold" data-create-launch-mission>Preparar missão de estreia</button><button class="btn" data-export-backup>Exportar backup agora</button></div></div>'}

function management(){return head('Central de Operações','Conte o que precisa. Vamos esclarecer juntos.','Uma solicitação não precisa chegar perfeita. O mundo identifica lacunas, pergunta o que falta e organiza o trabalho.')+'<div class="request-layout"><div class="form-card request-composer"><div class="composer-label"><span class="composer-orb">✦</span><div><h3>NOVA SOLICITAÇÃO</h3><p>Comece pela necessidade. Não precisa conhecer a estrutura interna.</p></div></div><form id="requestForm"><div class="field"><label for="rTitle">O que você quer resolver ou alcançar?</label><input id="rTitle" maxlength="120" required placeholder="Ex.: Quero lançar o primeiro vídeo do WordDark"></div><div class="world-questions" id="worldQuestions" aria-live="polite"><strong>O mundo quer entender.</strong><p>Conte a ideia acima. Vou apontar a próxima pergunta útil antes de encaminhar o trabalho.</p></div><div class="field"><label for="rDetail">Informações que já tem (opcional)</label><textarea id="rDetail" maxlength="1200" placeholder="Público, referência, prazo, material disponível, restrições…"></textarea></div><details class="advanced-settings"><summary>Ajustes internos (opcional)</summary><p>Se preferir, você pode escolher diretamente o tipo e o setor responsável.</p><div class="form-grid"><div class="field"><label for="rKind">Tipo de trabalho</label><select id="rKind"><option>Produção</option><option>Operação</option><option>Pesquisa</option><option>Correção</option><option>Financeira</option></select></div><div class="field"><label for="rArea">Área responsável</label><select id="rArea"><option>Céu / Dark Factory</option><option>Céu / Marketing</option><option>Terra / Gestão de canais</option><option>Terra / Comercial</option><option>WordDark / Auditoria</option></select></div></div><div class="field"><label for="rDate">Prazo desejado (opcional)</label><input id="rDate" type="date"></div></details><button class="btn gold submit-request" type="submit">Registrar e organizar o próxim function createLaunchMission(){const existing=contentJobs.find(j=>j.missionKey==='worddark-intro-v1'&&!['Cancelada'].includes(j.status));if(existing){activeJobId=existing.id;navigate('workbench');toast('A missão de estreia já existe; abrindo o rascunho existente.');return}const now=new Date().toISOString();const output=['WORDDARK — CONTEÚDO DE ESTREIA V1','','FORMATO PRINCIPAL · VÍDEO DE APRESENTAÇÃO (45–60 SEGUNDOS)','[ABERTURA — fundo escuro; identidade do canal]','E se uma ideia pudesse deixar de ser só uma ideia e virar uma operação organizada?','','[NARRAÇÃO]','Este é o WordDark: um projeto para conectar necessidades, soluções e execução em um mesmo mundo operacional.','','[TRINDADE VISUAL — WordDark / Terra / Céu]','O WordDark coordena o caminho. A Terra representa as necessidades e os negócios do mundo real. O Céu reúne criação, estratégia e soluções — começando pela Dark Factory e pelo Marketing.','','[CENAS DE INTERFACE — mostrar apenas telas reais disponíveis, sem simular integrações inexistentes]','A proposta é transformar pedidos em etapas rastreáveis: receber, organizar, produzir, revisar e devolver uma entrega. Cada parte deve poder evoluir sem obrigar todas as outras a parar.','','[FECHAMENTO]','Este é o começo. Vamos construir, testar e mostrar cada etapa conforme ela se tornar real. Bem-vindo ao WordDark.','','TEXTO FINAL NA TELA','WORDDARK · Um mundo. Intenções em movimento.','','VERSÃO CURTA · SHORT (15–20 SEGUNDOS)','Uma ideia não precisa ficar parada. WordDark é um projeto que conecta necessidades, criação e operação: a Terra traz o que precisa ser feito, o Céu desenvolve soluções e o WordDark coordena o caminho. Este é o começo — acompanhe a construção.','','TÍTULO SUGERIDO','WordDark: um mundo para transformar intenções em operações','','DESCRIÇÃO PARA YOUTUBE','Bem-vindo ao WordDark.','Estamos construindo um mundo operacional modular para organizar necessidades, criação e execução em etapas rastreáveis.','Nesta jornada, vamos mostrar o que es ;if(!srt){toast('Adicione e salve legendas SRT com timecodes antes de exportar.');return}if(!/\d{2}:\d{2}:\d{2}[,.]\d{3}\s+-->\s+\d{2}:\d{2}:\d{2}[,.]\d{3}/.test(srt)){toast('Os timecodes não parecem válidos. Use HH:MM:SS,mmm --> HH:MM:SS,mmm.');return}if(format==='srt'){content=srt;ext='srt';mime='application/x-subrip;charset=utf-8'}else{content='WEBVTT\n\n'+srt.replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,'$1.$2');ext='vtt';mime='text/vtt;charset=utf-8'}}else if(format==='dubbing'){if(!String(l.translatedTranscript||'').trim()){toast('Salve o texto traduzido antes de preparar o roteiro de dublagem.');return}ext='md';content=['# Roteiro de dublagem / voice-over','','Trabalho: '+j.id,'Idioma de destino: '+(l.targetLanguage||'Não definido'),'Idioma original: '+(l.sourceLanguage||'pt-BR'),'','## Texto adaptado para voz',l.translatedTranscript,'','## Notas de interpretação',l.dubbingNotes||'Sem notas adicionais.','','## Revisão obrigatória','Conferir pronúncia de nomes, sincronização, duração, direitos de uso da voz e adequação cultural.','','## Limite','Este arquivo é um roteiro textual; nenhum áudio foi gerado.'].join('\n')}else{toast('Formato de localização desconhecido.');return}downloadLocalizationFile('worddark-'+safe+'-'+lang+'-'+format+'.'+ext,content,mime);toast('Arquivo de localização exportado para uso manual.')}

function jobEditor(j){const l=j.localization||{};return '<div class="section-head"><h2>Editar entrega</h2><span>'+esc(j.id)+'</span></div>'+(j.executorId&&!j.localizationOnly&&!String(j.output||'').trim()&&['Briefing','Em produção'].includes(j.status)?'<button class="btn gold" data-prepare-current-job="'+esc(j.id)+'">Preparar pacote inicial para este perfil</button>':'')+'<button class="btn" data-export-job="'+esc(j.id)+'">Exportar pacote de entrega</button><div class="card"><div class="grid two"><div><div class="field"><label for="jOutput">Texto / resultado produzido</label><textarea id="jOutput" maxlength="10000" rows="9" placeholder="Escreva ou cole aqui o resultado produzido...">'+esc(j.output||'')+'</textarea></div><button class="btn gold" data-save-output="'+esc(j.id)+'">Salvar entrega</button></div><div><h3>REVISÃO E LIBERAÇÃO</h3><div class="field"><label><input id="jRights" type="checkbox" '+(j.rightsChecked?'checked':'')+'> Confirmei os direitos de uso dos materiais e referências</label></div><div class="field"><label><input id="jPolicy" type="checkbox" '+(j.policyChecked?'checked':'')+'> Revisei as regras da plataforma de destino</label></div><div class="field"><label><input id="jHumanApproval" type="checkbox" '+(j.humanApproved?'checked':'')+'> Revisei pessoalmente a entrega e autorizo sua aprovação interna</label></div><div class="field"><label for="jStatus">Etapa</label><select id="jStatus">'+['Briefing','Em produção','Em revisão','Aprovado','Entregue'].map(s=>'<option '+(j.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><p class="sub">A aprovação interna exige entrega salva, direitos e regras revisados e autorização humana explícita. A etapa Entregue só pode vir depois de Aprovado. Isso não publica em redes nem substitui validação legal.</p><button class="btn" data-save-review="'+esc(j.id)+'">Salvar revisão e etapa</button></div></div></div><div class="section-head"><h2>Tradução, legendas e dublagem</h2><span>'+esc(l.targetLanguage||'en-US')+'</span></div><div class="card"><div class="notice"><strong>Capacidade atual:</strong> organiza e exporta materiais. Tradução automática, reconhecimento de fala e geração de voz ainda precisam de motores de IA/áudio conectados; nada será publicado automaticamente.</div><div class="form-grid"><div class="field"><label for="lSourceLanguage">Idioma original</label><select id="lSourceLanguage">'+[['pt-BR','Português (Brasil)'],['en-US','Inglês (EUA)'],['es-ES','Espanhol'],['fr-FR','Francês'],['ja-JP','Japonês']].map(a=>'<option value="'+a[0]+'" '+((l.sourceLanguage||'pt-BR')===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></div><div class="field"><label for="lTargetLanguage">Idioma de destino</label><select id="lTargetLanguage">'+[['en-US','Inglês (EUA)'],['pt-BR','Português (Brasil)'],['es-ES','Espanhol'],['fr-FR','Francês'],['ja-JP','Japonês']].map(a=>'<option value="'+a[0]+'" '+((l.targetLanguage||'en-US')===a[0]?'selected':'')+'>'+a[1]+'</option>').join('')+'</select></div></div><div class="field"><label for="lSourceTranscript">Transcrição original</label><textarea id="lSourceTranscript" maxlength="20000" rows="5" placeholder="Cole a fala original ou a transcrição aprovada...">'+esc(l.sourceTranscript||'')+'</textarea></div><div class="field"><label for="lTranslatedTranscript">Texto traduzido / adaptado</label><textarea id="lTranslatedTranscript" maxlength="20000" rows="5" placeholder="Cole a tradução revisada para o idioma escolhido...">'+esc(l.translatedTranscript||'')+'</textarea></div><div class="field"><label for="lSubtitlesSrt">Legendas com timecodes (SRT)</label><textarea id="lSubtitlesSrt" maxlength="30000" rows="6" placeholder="1&#10;00:00:01,000 --> 00:00:03,000&#10;Texto da legenda...">'+esc(l.subtitlesSrt||'')+'</textarea></div><div class="field"><label for="lDubbingNotes">Roteiro de dublagem / notas de voz</label><textarea id="lDubbingNotes" maxlength="10000" rows="4" placeholder="Pronúncias, emoção, pausas, adaptação de expressões e notas para locução...">'+esc(l.dubbingNotes||'')+'</textarea></div><div style="display:flex;flex-wrap:wrap;gap:6px"><button class="btn gold" data-save-localization="'+esc(j.id)+'">Salvar localização</button><button class="btn" data-export-localization="'+esc(j.id)+'" data-format="brief">Preparar pacote de tradução</button><button class="btn" data-export-localization="'+esc(j.id)+'" data-format="translation">Exportar tradução</button><button class="btn" data-export-localization="'+esc(j.id)+'" data-format="srt">Exportar SRT</button><button class="btn" data-export-localization="'+esc(j.id)+'" data-format="vtt">Exportar VTT</button><button class="btn" data-export-localization="'+esc(j.id)+'" data-format="dubbing">Exportar roteiro de dublagem</button></div></div><div class="section-head"><h2>Histórico do trabalho</h2><span>'+(Array.isArray(j.history)?j.history.length:0)+' eventos</span></div>'+renderJobHistory(j)}
function commerce(){return head('Aplicativo empresarial 02','Empresa comercial','Base modular para produtos físicos e digitais. Cada área abre sua própria tela, sem mandar o usuário de volta ao mesmo painel.')+'<div class="notice"><strong>Modo V1:</strong> os cadastros abaixo são locais neste navegador. Ainda não publicam produtos nem conectam fornecedores, lojas, pedidos ou pagamentos reais.</div><div class="grid three" style="margin-top:14px">'+module('catalog','◇','Catálogo','Cadastrar produtos, categorias e preços.')+module('suppliers','▤','Fornecedores','Manter contatos e condições de fornecimento.')+module('orders','▣','Pedidos','Registrar e acompanhar pedidos manualmente.')+module('customers','♧','Clientes','Organizar contatos e histórico autorizado.')+module('costs','▥','Custos e margem','Calcular preço sugerido e margem estimada.')+module('commercialRules','⛨','Regras comerciais','Ver limites da operação e requisitos para ativação.')+'</div><div class="section-head"><h2>Base comercial local</h2></div><div class="grid stats">'+stat('Produtos',catalog.length,'Cadastros locais')+stat('Fornecedores',suppliers.length,'Cadastros locais')+stat('Pedidos',orders.length,'Registros manuais')+stat('Clientes',customers.length,'Cadastros locais')+'</div>'}

function businessStore(kind){const cfg={catalog:{title:'Catálogo de produtos',desc:'Cadastre produtos e preços pretendidos. O registro não publica o produto em lojas.',key:KEYS.catalog,rows:catalog,fields:[['name','Nome do produto','text'],['category','Categoria','text'],['price','Preço pretendido (R$)','number'],['cost','Custo estimado (R$)','number']]},suppliers:{title:'Fornecedores',desc:'Registre contatos comerciais e condições informadas; valide dados antes de qualquer compra.',key:KEYS.suppliers,rows:suppliers,fields:[['name','Nome / empresa','text'],['contact','Contato','text'],['terms','Prazo / condições','text']]},orders:{title:'Pedidos',desc:'Controle manual inicial. Nenhum pedido ou pagamento é enviado a terceiros.',key:KEYS.orders,rows:orders,fields:[['reference','Referência do pedido','text'],['customer','Cliente (nome ou código)','text'],['status','Estado','select'],['value','Valor estimado (R$)','number']]},customers:{title:'Clientes',desc:'Armazene somente dados necessários e autorizados. Evite informações sensíveis.',key:KEYS.customers,rows:customers,fields:[['name','Nome / identificador','text'],['contact','Contato autorizado','text'],['notes','Observação comercial','text']]}}[kind];if(!cfg)return commercialRules();const inputs=cfg.fields.map(([id,label,type])=>'<div class="field"><label for="biz-'+id+'">'+label+'</label>'+(type==='select'?'<select id="biz-'+id+'" name="'+id+'"><option>Recebido</option><option>Em preparação</option><option>Concluído</option><option>Cancelado</option></select>':'<input id="biz-'+id+'" name="'+id+'" type="'+type+'" maxlength="180" '+(type==='number'?'min="0" max="999999999" step=".01"':'')+' required placeholder="'+label+'">')+'</div>').join('');return head('Empresa comercial · V1',cfg.title,cfg.desc,'<button class="btn" data-go="commerce">← Empresa comercial</button>')+'<div class="grid two"><div class="card"><h3>NOVO REGISTRO</h3><form id="bizForm" data-kind="'+kind+'">'+inputs+'<button class="btn gold" type="submit">Salvar registro local</button></form></div><div class="card"><h3>LIMITES DO MÓDULO</h3><div class="rowline"><span>Persistência</span><span class="pill ready">Este navegador</span></div><div class="rowline"><span>Sincronização entre dispositivos</span><span class="pill pending">Não disponível</span></div><div class="rowline"><span>Integração externa / venda real</span><span class="pill off">Desativada</span></div><p class="sub">Use dados de teste nesta versão. Não cadastre dados de pagamento ou informações pessoais desnecessárias.</p></div></div><div class="section-head"><h2>Registros</h2><span>'+cfg.rows.length+' itens</span></div>'+(cfg.rows.length?'<div class="list">'+cfg.rows.slice().reverse().map(row=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(row.name||row.reference||'Registro')+'</div><div class="item-meta">'+cfg.fields.map(([id,label])=>label+': '+(id==='price'||id==='cost'||id==='value'?money(row[id]):esc(row[id]||'—')).replace(/^/, '')).join(' · ')+'</div></div><button class="btn" data-delete-business="'+kind+'" data-id="'+esc(row.id)+'">Excluir</button></div>').join('')+'</div>':empty('Nenhum registro. Use o formulário para criar o primeiro.'))}
function costs(){return head('Empresa comercial · análise','Custos e margem','Estimativa simples baseada nos produtos cadastrados. Não inclui impostos, taxas, frete ou outros custos que você não informar.')+'<div class="card"><h3>ESTIMATIVAS POR PRODUTO</h3>'+(catalog.length?'<div class="list">'+catalog.map(p=>{const price=Number(p.price||0),cost=Number(p.cost||0),margin=price-cost,pct=price>0?margin/price*100:0;return '<div class="item"><div class="item-main"><div class="item-title">'+esc(p.name)+'</div><div class="item-meta">Preço: '+money(price)+' · Custo informado: '+money(cost)+' · Diferença bruta: '+money(margin)+' · Margem sobre preço: '+pct.toLocaleString('pt-BR',{maximumFractionDigits:1})+'%</div></div></div>'}).join('')+'</div>':empty('Cadastre produtos com preço e custo no Catálogo para calcular estimativas.'))+'</div><div class="notice" style="margin-top:14px">Esses cálculos são estimativas brutas e não equivalem a lucro líquido nem substituem análise contábil.</div>'}
function commercialRules(){return head('Empresa comercial · governança','Regras comerciais','Condições necessárias antes de ativar vendas e automações externas.')+'<div class="card">'+[['Cadastro de produto','Disponível localmente'],['Validação de fornecedor','Manual; ainda não verificada externamente'],['Estoque e logística','Não integrados'],['Pagamento e reembolso','Desativados'],['Loja / marketplace','Não conectado'],['Autorização de compra e venda','Exige responsável e backend seguro']].map(x=>'<div class="rowline"><span>'+x[0]+'</span><span class="pill pending">'+x[1]+'</span></div>').join('')+'</div><div class="notice danger" style="margin-top:14px">Não use esta versão para receber pagamentos, processar dados bancários ou prometer disponibilidade real de estoque.</div>'}
function marketing(){return head('Céu · inteligência de distribuição','Marketing','Identidade, posicionamento, ganchos, calendário e estratégia de distribuição para as empresas e canais.')+'<div class="grid two">'+module('workbench','✎','Preparar conteúdo','Abra a bancada para criar roteiro, texto ou pacote de produção.')+module('library','▤','Registrar pesquisa e decisões','Guarde hipóteses e referências na biblioteca local.')+'</div><div class="section-head"><h2>Rotina de marketing</h2></div><div class="card">'+[['1','Definir objetivo e público'],['2','Escolher identidade e mensagem'],['3','Criar variações de gancho e chamada'],['4','Revisar direitos e regras da plataforma'],['5','Registrar hipótese e resultado após publicação']].map(x=>'<div class="rowline"><span>'+x[0]+' · '+x[1]+'</span><span class="pill '+(x[0]==='1'?'ready':'pending')+'">'+(x[0]==='1'?'Pode iniciar':'Processo manual / futuro')+'</span></div>').join('')+'</div><div class="notice" style="margin-top:14px">Pesquisa de tendências ao vivo e métricas de contas ainda dependem de conectores reais; não serão simuladas como se estivessem conectadas.</div>'}

function finance(){const bal=ledger.reduce((s,e)=>s+(e.type==='in'?e.amount:-e.amount),0),ins=ledger.filter(e=>e.type==='in').reduce((s,e)=>s+e.amount,0),outs=ledger.filter(e=>e.type==='out').reduce((s,e)=>s+e.amount,0);return head('Financeira do mundo','Cofre, resultado e repasses','A primeira camada financeira pertence às operações do WordDark. Ela registra entradas, saídas, resultado e propostas de repasse sem acesso direto ao financeiro privado.')+'<div class="notice"><strong>Separação de patrimônio:</strong> o Cofre do WordDark registra somente valores informados. A financeira privada do Ruan não é controlada por esta tela. Repasses abaixo são propostas pendentes, nunca transferências reais.</div><div class="grid stats" style="margin-top:14px">'+stat('Cofre do mundo',money(bal),'Saldo calculado dos registros',bal<0?'red-text':'green-text')+stat('Entradas',money(ins),'Total registrado','green-text')+stat('Saídas',money(outs),'Total registrado','red-text')+stat('Resultado registrado',money(ins-outs),'Entradas menos saídas',(ins-outs)<0?'red-text':'green-text')+'</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>REGISTRAR MOVIMENTO DO MUNDO</h3><form id="ledgerForm"><div class="field"><label for="lDesc">Descrição</label><input id="lDesc" maxlength="100" required placeholder="Ex.: receita da operação"></div><div class="form-grid"><div class="field"><label for="lType">Tipo</label><select id="lType"><option value="in">Entrada</option><option value="out">Saída</option></select></div><div class="field"><label for="lAmount">Valor (R$)</label><input id="lAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div></div><button class="btn gold" type="submit">Registrar no Cofre</button></form></div><div class="transfer"><h3>PROPOR REPASSE AO FINANCEIRO PRIVADO</h3><p>Esta ação registra uma proposta. Não movimenta dinheiro nem acessa a conta privada. A aprovação deverá ocorrer numa camada separada do Ruan, com confirmação explícita.</p><form id="transferForm"><div class="field"><label for="tAmount">Valor proposto (R$)</label><input id="tAmount" type="number" min=".01" max="999999999" step=".01" required placeholder="0,00"></div><div class="field"><label for="tReason">Motivo / origem</label><input id="tReason" maxlength="160" required placeholder="Ex.: distribuição de lucro validado"></div><button class="btn gold" type="submit">Criar proposta de repasse</button></form></div></div><div class="section-head"><h2>Histórico do Cofre</h2><span>'+ledger.length+' registros</span></div>'+(ledger.length?'<div class="card"><table class="table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>'+ledger.slice().reverse().map(e=>'<tr><td>'+esc(e.desc)+'</td><td>'+esc(e.type==='in'?'Entrada':'Saída')+'</td><td class="'+(e.type==='in'?'green-text':'red-text')+'">'+(e.type==='in'?'+ ':'− ')+money(e.amount)+'</td></tr>').join('')+'</tbody></table></div>':empty('O cofre do mundo ainda não tem lançamentos.'))+'<div class="section-head"><h2>Propostas de repasse</h2><span>'+transfers.length+' propostas</span></div>'+(transfers.length?'<div class="list">'+transfers.slice().reverse().map(t=>'<div class="item"><div class="item-main"><div class="item-title">'+esc(t.reason)+'</div><div class="item-meta">Destino: Financeiro privado do Ruan · '+new Date(t.createdAt).toLocaleString('pt-BR')+'</div></div><strong>'+money(t.amount)+'</strong><span class="pill pending">'+esc(t.status)+'</span></div>').join('')+'</div>':empty('Nenhuma proposta criada.'))}

function capabilities(){const rows=[{name:'Preparação automática de pacotes',sector:'WordDark / Dark Factory',status:'Disponível local',kind:'ready',target:'automation',detail:'Cria rascunhos iniciais a partir do briefing com regras locais; exige revisão e não publica.'},{name:'Registro de solicitações',sector:'Central de Operações',status:'Disponível local',kind:'ready',target:'management',detail:'Recebe a necessidade e guarda o registro neste navegador.'},{name:'Perguntas de esclarecimento',sector:'Central de Operações',status:'Disponível local',kind:'ready',target:'management',detail:'Identifica lacunas e orienta a preparação do pedido.'},{name:'Encaminhamento por setor',sector:'WordDark',status:'Disponível local',kind:'ready',target:'management',detail:'Abre a área sugerida e registra o último encaminhamento local.'},{name:'Briefing e fila da Dark Factory',sector:'Céu / Dark Factory',status:'Disponível local',kind:'ready',target:'workbench',detail:'Cria trabalhos, registra texto, organiza entregas e mantém histórico local.'},{name:'Tradução, SRT e VTT',sector:'Céu / Dark Factory',status:'Parcial / local',kind:'pending',target:'workbench',detail:'Armazena texto traduzido e exporta legendas fornecidas; não traduz nem transcreve automaticamente.'},{name:'Roteiro de dublagem',sector:'Céu / Dark Factory',status:'Parcial / local',kind:'pending',target:'workbench',detail:'Prepara e exporta roteiro textual; não gera voz ou áudio.'},{name:'Revisão e aprovação humana',sector:'Céu / Dark Factory',status:'Disponível local',kind:'ready',target:'workbench',detail:'Exige entrega, revisão de direitos, regras da plataforma e confirmação humana.'},{name:'Conexão OAuth com redes',sector:'WordDark / Segurança',status:'Não conectado',kind:'off',target:'security',detail:'Nenhum perfil externo é conectado por esta versão.'},{name:'Publicação em redes sociais',sector:'Terra / Gestão de canais',status:'Não conectado',kind:'off',target:'channels',detail:'Não publica em YouTube, Instagram function assessCaptureOpportunity(op){const reasons=[];let score=0;let validSource=false;try{const u=new URL(String(op.source||''));validSource=['http:','https:'].includes(u.protocol)}catch{}if(validSource){score+=25;reasons.push('fonte informada')}else{score-=20;reasons.push('fonte ausente/não validada')}if(Number(op.valuePotential||0)>0){score+=15;reasons.push('potencial informado')}else{reasons.push('potencial não estimado')}const deadline=op.deadline?new Date(op.deadline+'T23:59:59'):null;let expired=false;if(deadline&&!Number.isNaN(deadline.getTime())){if(deadline.getTime()<Date.now()){score-=20;expired=true;reasons.push('prazo vencido')}else{score+=10;reasons.push('prazo informado')}}const next=String(op.requirementsAndNextStep||'');if(next.trim().length>=30){score+=20;reasons.push('próximo passo descrito')}else{reasons.push('detalhar próximo passo')}if(/custo|taxa|gr[aá]tis|gratuit|or[cç]amento|investimento/i.test(next)){score+=10;reasons.push('custos/condições mencionados')}else{reasons.push('confirmar custos')}if(/requisito|eleg[ií]vel|elegibilidade|experi[eê]ncia|documento|portf[oó]lio|inscri[cç][aã]o/i.test(next)){score+=10;reasons.push('elegibilidade mencionada')}else{reasons.push('confirmar elegibilidade')}if(op.kind&&op.kind!=='Outra oportunidade'){score+=10;reasons.push('categoria definida')}score=Math.max(0,Math.min(100,score));return{score,label:score>=70?'Prioridade para revisão':score>=45?'Completar dados':'Baixa confiança',reasons,expired}}

 if(/produto|loja|fornecedor|cliente|pedido|venda|comercial|ecommerce|e-commerce/.test(t))return {kind:'Operação',area:'Terra / Comercial',label:'Operação comercial',first:'Em qual parte do negócio precisamos atuar primeiro?',firstChips:['Pesquisar fornecedores','Organizar produtos','Planejar uma venda','Automatizar pedidos'],second:'Qual resultado concreto você espera?',secondChips:['Lista de opções','Catálogo organizado','Processo de venda','Fluxo de automação'],third:'Já existem produtos, fornecedores ou regras que precisam ser usados?',thirdChips:['Já tenho dados','Preciso pesquisar opções','Tenho um processo para corrigir','Ainda estou definindo']};
 if(/conexão|conectar|api|integração|plataforma|conta externa|oauth|sincron/.test(t))return {kind:'Operação',area:'WordDark / Auditoria',label:'Conexão e integração',first:'Qual sistema precisa se conectar e em qual direção os dados devem circular?',firstChips:['Receber informações','Enviar uma publicação','Sincronizar arquivos','Mapear possibilidades primeiro'],second:'Qual capacidade precisa funcionar primeiro?',secondChips:['Autenticar com segurança','Ler dados','Enviar dados','Testar sem operar de verdade'],third:'Há documentação, conta de teste e permissões disponíveis?',thirdChips:['Tenho documentação','Tenho conta de teste','Preciso configurar permissões','Ainda não sei']};
 if(/erro|falha|corrigir|quebrou|bug|não funciona|nao funciona/.test(t))return {kind:'Correção',area:'WordDark / Auditoria',label:'Diagnóstico e correção',first:'Qual comportamento está falhando?',firstChips:['Não abre','Não salva corretamente','Uma operação falha','Aparece uma mensagem de erro'],second:'O que deveria acontecer no lugar?',secondChips:['Abrir uma tela','Salvar os dados','Completar uma operação','Outro resultado'],third:'Você tem mensagem de erro, passos para reproduzir ou um exemplo?',thirdChips:['Tenho mensagem de erro','Consigo reproduzir','Tenho uma captura ou exemplo','Preciso investigar primeiro']};
 if(/custo|dinheiro|finance|pagamento|receita|despesa|orçamento|orcamento|assinatura/.test(t))return {kind:'Financeira',area:'WordDark / Auditoria',label:'Financeiro e planejamento',first:'O que você precisa fazer com os valores?',firstChips:['Registrar movimento','Calcular custos','Planejar orçamento','Auditar um registro'],second:'Qual período ou decisão está envolvido?',secondChips:['Uma operação pontual','Este mês','Um plano recorrente','Ainda preciso definir'],third:'Já tem valores e comprovantes, ou precisa preparar uma estimativa?',thirdChips:['Tenho valores registrados','Tenho comprovantes','Preciso estimar','Ainda vou reunir os dados']};
 return {kind:'Pesquisa',area:'WordDark / Auditoria',label:'Solicitação geral',first:'Qual resultado você quer alcançar?',firstChips:['Criar algo novo','Melhorar algo existente','Descobrir como funciona','Resolver um problema'],second:'Como você vai reconhecer que a tarefa deu certo?',secondChips:['Receber algo pronto','Ter um plano claro','Entender as opções','Corrigir uma falha'],third:'Que contexto, material ou limite pode mudar a solução?',thirdChips:['Tenho referências','Há um prazo importante','Existem limites que devemos respeitar','Quero ajuda para descobrir']};
}
function updateWorldQuestions(){
 if(!worldQuestions||!rfTitle)return;
 const title=rfTitle.value.trim(),detail=rfDetail?rfDetail.value.trim():'';
 if(!title){worldQuestions.dataset.stage='0';worldQuestions.innerHTML='<strong>Vamos entender a necessidade.</strong><p>Conte o que você quer resolver. Vou fazer uma pergunta por vez e sugerir a área responsável.</p>';return}
 const profile=classifyRequestIntent(title);
 const stage=Math.max(0,Math.min(4,Number(worldQuestions.dataset.stage||0)));
 if(stage===0){if($('rArea'))$('rArea').value=profile.area;if($('rKind'))$('rKind').value=profile.kind}
 let heading='',question='',chips=[];
 if(stage===0){heading='1 · Entender o pedido';question=profile.first;chips=profile.firstChips}
 else if(stage===1){heading='2 · Definir o resultado';question=profile.second;chips=profile.secondChips}
 else if(stage===2){heading='3 · Reunir o contexto';question=profile.third;chips=profile.thirdChips}
 else if(stage===3){heading='4 · Conferir os limites';question='Há prazo, autorização, direitos de uso ou alguma condição que não podemos ultrapassar?';chips=['Sem prazo definido','Tenho um prazo','Precisa de revisão antes de usar','Há limites importantes']}
 else {heading='Direção inicial organizada';question='Área sugerida: '+profile.area+'. Tipo sugerido: '+profile.kind+'. Confira as informações abaixo e registre quando estiver pronto.';chips=[]}
 worldQuestions.innerHTML='<strong>'+esc(heading)+'</strong><p>'+esc(question)+(detail?' <span class="question-context">Contexto reunido: '+esc(detail.length>180?detail.slice(0,177)+'…':detail)+'</span>':'')+'</p>'+(chips.length?'<div class="question-chips">'+chips.map(c=>'<button type="button" data-answer="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div>':'')+'<div class="question-actions">'+(stage>0?'<button type="button" class="btn" data-question-back>← Pergunta anterior</button>':'')+(stage<4?'<button type="button" class="btn" data-question-next>Próxima pergunta →</button>':'<button type="button" class="btn gold" data-request-ready>Registrar solicitação ↗</button>')+'</div>';
 worldQuestions.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(rfDetail){const current=rfDetail.value.trim();rfDetail.value=current?(current+'\n'+b.dataset.answer):b.dataset.answer}worldQuestions.dataset.stage=String(Math.min(4,stage+1));updateWorldQuestions();if(rfDetail)rfDetail.focus()}));
 const back=worldQuestions.querySelector('[data-question-back]');if(back)back.addEventListener('click',()=>{worldQuestions.dataset.stage=String(Math.max(0,stage-1));updateWorldQuestions()});
 const next=worldQuestions.querySelector('[data-question-next]');if(next)next.addEventListener('click',()=>{worldQuestions.dataset.stage=String(Math.min(4,stage+1));updateWorldQuestions()});
 const ready=worldQuestions.querySelector('[data-request-ready]');if(ready&&$('requestForm'))ready.addEventListener('click',()=>{$('requestForm').requestSubmit()});
}
if(rfTitle)rfTitle.addEventListener('input',()=>{if(worldQuestions)worldQuestions.dataset.stage='0';updateWorldQuestions()});
if(rfDetail)rfDetail.addEventListener('input',updateWorldQuestions);
updateWorldQuestions();
const rf=$('requestForm');if(rf)rf.addEventListener('submit',e=>{e.preventDefault();const title=$('rTitle').value.trim();if(!title)return;const profile=classifyRequestIntent(title);const item={id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,kind:$('rKind').value||profile.kind,area:$('rArea').value||profile.area,date:$('rDate').value,detail:$('rDetail').value.trim(),status:'Aberta',clarificationStage:Number(worldQuestions?.dataset.stage||0),suggestedArea:profile.area,suggestedKind:profile.kind,createdAt:new Date().toISOString()};requests.push(item);if(!write(KEYS.requests,requests))return;render();toast('Solicitação registrada localmente. A sugestão de área ficou salva para conferência.')});
const lf=$('ledgerForm');if(lf)lf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('lAmount').value),desc=$('lDesc').value.trim();if(!desc||!Number.isFinite(amount)||amount<=0)return;ledger.push({id:String(Date.now()),desc,amount,type:$('lType').value,createdAt:new Date().toISOString()});write(KEYS.ledger,ledger);render();toast('Lançamento adicionado ao Cofre do mundo.')});
const tf=$('transferForm');if(tf)tf.addEventListener('submit',e=>{e.preventDefault();const amount=Number($('tAmount').value),reason=$('tReason').value.trim();if(!reason||!Number.isFinite(amount)||amount<=0)return;transfers.push({id:String(Date.now()),amount,reason,status:'Aguardando decisão',createdAt:new Date().toISOString()});write(KEYS.transfers,transfers);render();toast('Proposta criada; nenhum dinheiro foi transferido.')});
const nf=$('noteForm');if(nf)nf.addEventListener('submit',e=>{e.preventDefault();const title=$('nTitle').value.trim(),body=$('nBody').value.trim();if(!title||!body)return;notes.push({id:String(Date.now()),title,body,createdAt:new Date().toISOString()});write(KEYS.notes,notes);render();toast('Nota guardada na biblioteca local.')})}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();window.addEventListener('storage',e=>{if(e.key===KEYS.captureInbox&&page==='capture')render()});window.addEventListener('focus',()=>{if(page==='capture')render()});
})();
</script></body></html>
