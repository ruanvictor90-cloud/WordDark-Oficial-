<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070f"><meta name="description" content="Painel de gestão do mundo pertencente ao Ruan."><link rel="stylesheet" href="./app.css?v=20261014-1"><title>Central · Ruan Hub</title>
<style>
.central-page{width:min(100%,520px);margin:0 auto;padding:16px 0 24px}.central-head{display:flex;align-items:center;gap:12px;padding:10px 0 18px}.central-head .central-app-logo{width:48px;height:48px;flex:0 0 48px}.central-head h1{font-size:20px;margin:0}.central-head p{font-size:12px;color:#a99ab9;margin:4px 0 0}.central-apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.central-subapp{min-height:105px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;border:1px solid #342443;border-radius:16px;background:linear-gradient(145deg,#171020,#100c17);color:#e5d3ff;font-size:12px;font-weight:750}.central-subapp svg{width:35px;height:35px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.central-subapp.active{border-color:#9a6bd0;background:#21152e}.central-panel{margin-top:14px;border:1px solid #342443;border-radius:16px;padding:14px;background:#120d19}.central-panel h2{font-size:15px;margin:0 0 10px}.central-empty{padding:14px 8px;text-align:center;color:#a99ab9;font-size:12px;line-height:1.6}.hub-request{display:flex;gap:8px;margin-top:12px}.hub-request input{min-width:0;flex:1;background:#09070f;color:#f4efff;border:1px solid #3c2b4e;border-radius:10px;padding:11px;font:inherit;font-size:12px}.hub-request button{border:1px solid #8059a4;background:#2b1c3c;color:#f4efff;border-radius:10px;padding:0 12px;font-size:11px;font-weight:800}.request-item{border:1px solid #3c2b4e;border-radius:11px;padding:10px;margin:8px 0}.request-item strong{font-size:12px}.request-item small{display:block;margin-top:5px;color:#a99ab9;font-size:10px}.central-back{display:inline-flex;align-items:center;gap:6px;color:#d8c2f5;text-decoration:none;font-size:12px;margin-bottom:8px}
</style></head><body><main class="shell"><header class="topbar"><span class="topbar-spacer" aria-hidden="true"></span><a class="brand" href="./central.html" aria-label="Central do Hub"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path class="mark-frame" d="M32 5 55 18v28L32 59 9 46V18Z"/><path class="mark-path" d="M20 21v22l12-12 12 12V21"/><circle class="mark-core" cx="32" cy="31" r="4"/></svg></span><span class="brand-copy"><strong>RUAN <i>HUB</i></strong><small>Central operacional</small></span></a><span style="width:38px"></span></header><a class="ruan-return hub-return-under-header" href="./index.html" aria-label="Voltar ao Hub"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg><span>Hub</span></a><section class="central-page"><div class="central-head"><span class="central-app-logo"><svg viewBox="0 0 64 64"><path d="M32 5 55 18v28L32 59 9 46V18Z"/><path d="M20 21v22l12-12 12 12V21"/><circle cx="32" cy="31" r="4"/></svg></span><div><h1>Central</h1><p>Painel de gestão do mundo, pertencente ao Ruan e independente da Central do WordDark.</p></div></div><nav class="central-apps" aria-label="Aplicativos da Central"><button class="central-subapp" data-view="pedidos" type="button"><svg viewBox="0 0 64 64"><rect x="13" y="7" width="38" height="50" rx="5"/><path d="M23 20h18M23 30h18M23 40h13"/></svg><span>Pedidos</span></button><button class="central-subapp" data-view="execucao" type="button"><svg viewBox="0 0 64 64"><rect x="7" y="12" width="50" height="40" rx="6"/><path d="M18 25h28M18 34h28M18 43h18"/></svg><span>Em execução</span></button></nav><section id="central-panel" class="central-panel" aria-live="polite"></section></section></main>
<script>
(()=>{const panel=document.getElementById('central-panel'),buttons=[...document.querySelectorAll('[data-view]')],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function requests(){try{const x=JSON.parse(localStorage.getItem('worddark.hub.quick-requests.v1')||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function render(view){buttons.forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='pedidos'){const rows=requests().slice().reverse();panel.innerHTML='<h2>Pedidos recebidos</h2>'+(rows.length?rows.map(r=>'<article class="request-item"><strong>'+esc(r.title)+'</strong><small>'+esc(r.status||'Recebido')+' · '+esc(new Date(r.createdAt).toLocaleString('pt-BR'))+'</small></article>').join(''):'<div class="central-empty">Nenhum pedido ainda. Use a barra de pedido do Hub para registrar uma solicitação.</div>')+'<form id="hub-request-form" class="hub-request"><input id="hub-request-title" required maxlength="500" placeholder="Descrever novo pedido"><button type="submit">Registrar</button></form>';document.getElementById('hub-request-form').addEventListener('submit',e=>{e.preventDefault();const title=document.getElementById('hub-request-title').value.trim();if(!title)return;const list=requests();list.push({id:'HUB-'+Date.now().toString(36).toUpperCase(),title,createdAt:new Date().toISOString(),source:'Central do Hub',status:'Recebido'});localStorage.setItem('worddark.hub.quick-requests.v1',JSON.stringify(list));render('pedidos')})}else{const active=requests().filter(r=>['Em execução','Em andamento'].includes(r.status));panel.innerHTML='<h2>Em execução</h2>'+(active.length?active.map(r=>'<article class="request-item"><strong>'+esc(r.title)+'</strong><small>'+esc(r.status)+' · '+esc(new Date(r.createdAt).toLocaleString('pt-BR'))+'</small></article>').join(''):'<div class="central-empty">Nenhuma execução registrada. Os trabalhos aparecerão aqui quando forem encaminhados e tiverem o estado atualizado.</div>')}}buttons.forEach(b=>b.addEventListener('click',()=>render(b.dataset.view)));const view=new URLSearchParams(location.search).get('view')||'pedidos';render(view==='execucao'?'execucao':'pedidos')})();
</script></body></html>
